/* ============================================================
   COFFRE CHIFFRÉ SUR DOSSIER PARTAGÉ (API File System Access de Chrome / Edge)
   Organisation du dossier :
     coffre.json                  annuaire des comptes (clés publiques, clés privées chiffrées) + empreinte
     commun.json                  réglages de campagne, chiffrés
     agents/<id>.json             un fichier chiffré par dossier agent (clé propre au dossier)
     creneaux/<compte>.json       disponibilités de chaque N+1, chiffrées
     journal/<AAAA-MM>/…json      journal en ajout seul : un fichier par lot d'actions, jamais réécrit
     verrous/<id>.json            « X modifie ce dossier » (expire après 2 min sans signe de vie)
     connexions/<compte>.json     dernière connexion
     dernier-enregistrement.json  auteur et date du dernier enregistrement
     sauvegardes/<AAAA-MM-JJ>/    copie quotidienne automatique (30 jours)
     archives/                    copies avant restauration ou remise à zéro
   ============================================================ */
const DEFAULT_PATH = "Z:\\000001. ARTEFACT À OUVRIR AVEC CHROME\\ENTRETIENS PROS";
const F_HEAD="coffre.json", F_COMMON="commun.json", F_LAST="dernier-enregistrement.json";
const FAILKEY="spv_echecs", LEGACY_KEY="ep_spv_v1";
const LOCK_TTL=120000, POLL_MS=25000, BACKUP_DAYS=30;
let FOLDER=null;       // poignée du dossier partagé
let V=null;            // coffre chiffré en mémoire (même forme que sur le disque)
let SESSION=null;      // clés en mémoire uniquement, effacées au verrouillage
let S=null;            // données déchiffrées accessibles à l'utilisateur connecté
let COMMON=null;       // bloc commun déchiffré
let RO=null;           // motif de lecture seule (null = écriture possible)
const CACHE=new Map(); // chemin -> {text,mod} : dernier état connu sur le disque

/* --- accès fichiers --- */
const FS={
  async dir(path,create){ let d=FOLDER; for(const p of String(path||"").split("/").filter(Boolean)) d=await d.getDirectoryHandle(p,{create:!!create}); return d; },
  split(path){ const parts=path.split("/"); const name=parts.pop(); return [parts.join("/"),name]; },
  async read(path){ const [dp,name]=FS.split(path); try{ const d=await FS.dir(dp); const f=await (await d.getFileHandle(name)).getFile(); return {text:await f.text(),mod:f.lastModified}; }catch(e){ if(e&&(e.name==="NotFoundError"||e.name==="TypeMismatchError")) return null; throw e; } },
  async readJSON(path){ const r=await FS.read(path); try{ return r?JSON.parse(r.text):null; }catch(e){ return null; } },
  async write(path,data){ const [dp,name]=FS.split(path); const d=await FS.dir(dp,true); const w=await (await d.getFileHandle(name,{create:true})).createWritable(); await w.write(data); await w.close(); },
  async remove(path,recursive){ const [dp,name]=FS.split(path); try{ const d=await FS.dir(dp); await d.removeEntry(name,{recursive:!!recursive}); return true; }catch(e){ return false; } },
  async list(path){ try{ const d=await FS.dir(path); const out=[]; for await (const [n,h] of d.entries()) out.push({name:n,kind:h.kind,h}); return out; }catch(e){ return []; } },
  async copyTree(src,dst,skip){ for(const e of await FS.list(src)){ if(skip&&skip(e.name)) continue; const sp=(src?src+"/":"")+e.name, dp=dst+"/"+e.name; if(e.kind==="directory") await FS.copyTree(sp,dp); else { const f=await e.h.getFile(); await FS.write(dp,await f.arrayBuffer()); } } }
};
async function fsWrite(path,text){ if(RO) throw new Error(RO); try{ await FS.write(path,text); CACHE.set(path,{text,mod:null}); }catch(e){ setRO("Le dossier partagé n'accepte plus l'écriture ("+(e.name||e.message)+"). Vos dernières modifications ne sont pas enregistrées."); throw e; } }
function setRO(msg){ RO=msg; if(SESSION) render(); }

/* --- mémorisation du dossier par poste (IndexedDB) --- */
const IDB={ open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("entretiens-pros",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ try{ const db=await IDB.open(); return await new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await IDB.open(); return await new Promise(res=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }); }catch(e){ return false; } } };

function legacyPlain(){ try{ const raw=localStorage.getItem(LEGACY_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
const visibleUsers = () => Object.values(V?.users||{}).filter(u=>!u.recovery);
const userById = id => V?.users?.[id];
const me = () => SESSION?userById(SESSION.uid):null;
const isAdmin = () => me()?.role==="admin";
const can = d => { const u=me(); return !!u && !RO_ACCOUNT() && (u.role==="admin" || !!(u.droits||{})[d]); };
const RO_ACCOUNT = () => me()?.role==="lecture";
const uName = u => u ? (u.recovery?"Clé de secours":`${u.prenom||""} ${u.nom||""}`.trim()||u.login) : "";
function n1Label(a){ const u=a&&a.n1Id?userById(a.n1Id):null; if(u) return `${(u.nom||"").toUpperCase()} ${u.prenom||""}${u.fonction?" ("+u.fonction+")":""}`.trim(); return a?.n1||""; }

/* --- annuaire : empreinte HMAC --- */
function dirCanon(users){ users=users||V.users; const ids=Object.keys(users).sort(); return JSON.stringify(ids.map(id=>{ const u=users[id]; return [u.id,u.login,u.nom,u.prenom,u.fonction,u.role,u.droits,u.agentId,u.actif,u.mustChange,u.recovery||false,u.pub,u.priv]; })); }
async function signDir(){ const k=await C.hmacKey(COMMON.dirKey); V.dirMac=await C.mac(k,dirCanon()); }
async function checkDir(users,mac){ const k=await C.hmacKey(COMMON.dirKey); return (mac??V.dirMac)===await C.mac(k,dirCanon(users)); }

/* --- destinataires d'une clé --- */
function recipientsFor(agent){ return Object.values(V.users).filter(u=>u.actif && (u.role==="admin" || u.role==="lecture" || (agent && u.id===agent.n1Id))); }
function commonRecipients(){ return Object.values(V.users).filter(u=>u.actif); }
async function wrapFor(key,users){ const keys={}; for(const u of users) keys[u.id]=await C.wrap(key,u.pub); return keys; }

/* --- trousseau (journal, créneaux) : nouvelle clé à chaque révocation, anciennes conservées pour relire --- */
async function ringKey(kid){ const r=(COMMON.ring||[]).find(x=>x.id===kid)||(COMMON.ring||[]).slice(-1)[0]; return crypto.subtle.importKey("raw",b64u8(r.k),"AES-GCM",false,["encrypt","decrypt"]); }
async function sealRing(obj,aad){ const r=COMMON.ring.slice(-1)[0]; return {kid:r.id,...await C.seal(await ringKey(r.id),obj,aad)}; }
async function openRing(box,aad){ return C.open(await ringKey(box.kid),box,aad); }
function newRingEntry(){ return {id:"k"+randCode(6).toLowerCase(),k:u8b64(rnd(32))}; }

/* --- journal : ajout seul --- */
function journal(action,cible){ if(!SESSION) return; (SESSION.jbuf=SESSION.jbuf||[]).push({t:Date.now(),u:SESSION.uid,a:action,c:cible||""}); }
async function flushJournal(){ if(!SESSION||!SESSION.jbuf||!SESSION.jbuf.length||!COMMON||RO) return; const items=SESSION.jbuf.splice(0); const d=new Date();
  const path=`journal/${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}/${Date.now()}-${SESSION.uid}-${randCode(4)}.json`;
  try{ await fsWrite(path,JSON.stringify(await sealRing(items,"journal:"+V.id))); }catch(e){ SESSION.jbuf.unshift(...items); } }
async function loadJournal(){ const out=[]; for(const m of await FS.list("journal")){ if(m.kind!=="directory") continue; for(const f of await FS.list("journal/"+m.name)){ try{ const box=JSON.parse(await (await f.h.getFile()).text()); out.push(...await openRing(box,"journal:"+V.id)); }catch(e){} } } return out.sort((a,b)=>a.t-b.t); }

/* --- en-tête (annuaire) --- */
function headOf(){ return {format:"spv-coffre-dossier",v:3,id:V.id,commune:V.commune,ville:V.ville,logo:V.logo||"",entete:V.entete||null,created:V.created,users:V.users,deletedUsers:V.deletedUsers||{},dirMac:V.dirMac}; }
async function writeHead(){ const mine=JSON.stringify(headOf()); const c=CACHE.get(F_HEAD); if(c&&c.text===mine) return false;
  const disk=await FS.read(F_HEAD);
  if(disk&&c&&disk.text!==c.text){ const o=JSON.parse(disk.text);
    if(!await checkDir(o.users,o.dirMac)){ SESSION.alert="L'annuaire du dossier partagé a été modifié hors de l'application : enregistrement des comptes suspendu."; return false; }
    const del={...(o.deletedUsers||{}),...(V.deletedUsers||{})}; const merged={};
    for(const id of new Set([...Object.keys(o.users),...Object.keys(V.users)])){ if(del[id]) continue; const a=V.users[id], b=o.users[id]; merged[id]=!a?b:!b?a:((b.updated||0)>(a.updated||0)?b:a); }
    V.users=merged; V.deletedUsers=del; ["commune","ville","logo","entete"].forEach(k=>{ if(o[k]!==undefined&&JSON.stringify(o[k])!==JSON.stringify(JSON.parse(c.text)[k])&&JSON.stringify(V[k])===JSON.stringify(JSON.parse(c.text)[k])) V[k]=o[k]; }); setOrg(V);
    await signDir(); }
  await fsWrite(F_HEAD,JSON.stringify(headOf())); return true; }

/* --- création du coffre dans le dossier --- */
async function createVault({nom,prenom,fonction,login,pass,commune,ville,logo}){
  const commonKey=await C.aesNew(); const intake=await C.rsaNew();
  const intakePriv=u8b64(new Uint8Array(await crypto.subtle.exportKey("pkcs8",intake.privateKey))); const intakePub=await C.pubExport(intake.publicKey);
  const recovery=[0,1,2,3,4,5].map(()=>randCode(5)).join("-");
  const idA=await C.newIdentity(pass), idR=await C.newIdentity(normCode(recovery));
  const now=Date.now(); const uid="u"+randCode(8).toLowerCase();
  V={id:randCode(10),commune,ville,logo:logo||"",entete:null,created:now,users:{},deletedUsers:{},dirMac:"",common:null,agents:{}};
  V.users[uid]={id:uid,login:login.toLowerCase(),nom,prenom,fonction,role:"admin",droits:{},agentId:"",actif:true,mustChange:false,pub:idA.pub,priv:idA.priv,created:now,updated:now};
  V.users.recovery={id:"recovery",login:"secours",nom:"",prenom:"",fonction:"",role:"admin",droits:{},agentId:"",actif:true,mustChange:false,recovery:true,pub:idR.pub,priv:idR.priv,created:now,updated:now};
  COMMON={campagne:{annee:new Date().getFullYear(),dateCourrier:"",lieu:"Mairie – bureau du DGS",signataire:`${prenom} ${nom}${fonction?", "+fonction:""}`,duree:60,pause:10,mailRetour:"",urlQuestionnaire:""},refFormations:[],intakePub,intakePriv,dirKey:u8b64(rnd(32)),ring:[newRingEntry()],settings:{lockMin:10,retentionAns:3},pageGen:null};
  V.common={u:now,by:uid,...await C.seal(commonKey,COMMON,"common:"+V.id),keys:await wrapFor(commonKey,Object.values(V.users))};
  await signDir();
  SESSION={uid,commonKey,agentKeys:new Map(),last:new Map(),keysDirty:new Set(),jbuf:[]};
  CACHE.clear(); await fsWrite(F_HEAD,JSON.stringify(headOf())); await fsWrite(F_COMMON,JSON.stringify(V.common)); SESSION.lastCommon=JSON.stringify(COMMON);
  journal("création du coffre",commune); await flushJournal(); await markLast(prenom+" "+nom);
  SESSION=null; COMMON=null; return recovery; }
/* import d'un coffre exporté (fichier unique de la version en ligne) vers le dossier */
async function importVaultExport(o){ if(!o||o.format!=="spv-coffre") throw new Error("Ce fichier n'est pas un coffre exporté.");
  if(!o.commune||o.commune==="Saint-Privat-des-Vieux"){ o.commune=o.commune?"Commune de Saint-Privat-des-Vieux":"Collectivité"; o.ville=o.ville||"Saint-Privat-des-Vieux"; }
  const head={format:"spv-coffre-dossier",v:3,id:o.id,commune:o.commune,ville:o.ville||"",logo:o.logo||"",entete:null,created:o.created,users:o.users,deletedUsers:{},dirMac:o.dirMac};
  await FS.write(F_HEAD,JSON.stringify(head)); await FS.write(F_COMMON,JSON.stringify(o.common));
  for(const [id,b] of Object.entries(o.agents||{})) await FS.write("agents/"+id+".json",JSON.stringify(b));
  await FS.write(F_LAST,JSON.stringify({par:"import du coffre exporté",le:Date.now()})); }

async function markLast(name){ try{ await fsWrite(F_LAST,JSON.stringify({par:name||uName(me()),le:Date.now()})); }catch(e){} }

/* --- connexion --- */
function failState(uid){ try{ return (JSON.parse(localStorage.getItem(FAILKEY)||"{}"))[uid]||{n:0,until:0}; }catch(e){ return {n:0,until:0}; } }
function setFail(uid,st){ try{ const o=JSON.parse(localStorage.getItem(FAILKEY)||"{}"); if(st) o[uid]=st; else delete o[uid]; localStorage.setItem(FAILKEY,JSON.stringify(o)); }catch(e){} }
function findUser(users,id){ const q=norm(id).replace(/[\s.]+/g," ").trim(); if(!q) return null; return Object.values(users).find(u=>u.login===String(id).trim().toLowerCase()) || Object.values(users).find(u=>!u.recovery&&(norm(u.prenom+" "+u.nom)===q||norm(u.nom+" "+u.prenom)===q)); }
async function readHead(){ const r=await FS.read(F_HEAD); if(!r) return null; try{ const o=JSON.parse(r.text); if(o.format!=="spv-coffre-dossier") return null; CACHE.set(F_HEAD,r); return o; }catch(e){ return null; } }
async function login(loginName,pass){
  const head=await readHead(); if(!head) throw new Error("Aucun coffre dans ce dossier.");
  V={...head,common:null,agents:{}}; setOrg(V);
  const u=findUser(V.users,loginName);
  if(!u){ await new Promise(r=>setTimeout(r,700)); throw new Error("Identifiant ou mot de passe incorrect."); }
  if(!u.actif) throw new Error("Ce compte est désactivé. Contactez l'administrateur.");
  const fs=failState(u.id); if(fs.until>Date.now()) throw new Error(`Trop d'essais. Réessayez dans ${Math.ceil((fs.until-Date.now())/1000)} s.`);
  let priv; try{ priv=await C.unlock(u.priv, u.recovery?normCode(pass):pass); }
  catch(e){ const n=fs.n+1; setFail(u.id,{n,until:n>=5?Date.now()+Math.min(900000,30000*Math.pow(2,n-5)):0}); throw new Error("Identifiant ou mot de passe incorrect."+(n>=3?` (${n} essais)`:"")); }
  setFail(u.id,null);
  const cr=await FS.read(F_COMMON); if(!cr) throw new Error("Fichier commun.json introuvable dans le dossier."); CACHE.set(F_COMMON,cr); V.common=JSON.parse(cr.text);
  if(!V.common.keys[u.id]) throw new Error("Ce compte n'a pas encore reçu ses clés. Demandez à l'administrateur de réinitialiser votre accès.");
  const commonKey=await C.unwrap(V.common.keys[u.id],priv);
  COMMON=await C.open(commonKey,V.common,"common:"+V.id);
  SESSION={uid:u.id,priv,commonKey,agentKeys:new Map(),last:new Map(),keysDirty:new Set(),jbuf:[],mods:new Map(),modsAt:Date.now(),conflicts:[],started:Date.now(),kiosk:null};
  if(!COMMON.ring){ COMMON.ring=[newRingEntry()]; }
  SESSION.lastCommon=JSON.stringify(COMMON);
  SESSION.dirOk=await checkDir();
  await loadAgents();
  if(COMMON.journal&&COMMON.journal.length&&u.role==="admin"){ SESSION.jbuf.unshift(...COMMON.journal); delete COMMON.journal; }
  journal("connexion",u.recovery?"clé de secours":""); try{ await fsWrite("connexions/"+u.id+".json",JSON.stringify({le:Date.now()})); }catch(e){}
  await persistNow(); startPolling();
  return u; }
async function decryptAgentBlob(id,blob){ const w=blob.keys&&blob.keys[SESSION.uid]; if(!w) return null; const k=await C.unwrap(w,SESSION.priv); return {k,d:await C.open(k,blob,"agent:"+id+":"+V.id)}; }
async function loadAgents(){
  const agents=[],autoEvals={},entretiens={},historique={},planning=[];
  for(const e of await FS.list("agents")){ if(e.kind!=="file"||!e.name.endsWith(".json")) continue; const id=e.name.slice(0,-5); const path="agents/"+e.name;
    try{ const f=await e.h.getFile(); const text=await f.text(); CACHE.set(path,{text,mod:f.lastModified}); const blob=JSON.parse(text); V.agents[id]=blob;
      const r=await decryptAgentBlob(id,blob); if(!r) continue; SESSION.agentKeys.set(id,r.k); const d=r.d;
      agents.push(d.agent); if(d.auto) autoEvals[id]=d.auto; if(d.ent) entretiens[id]=d.ent; if(d.hist&&d.hist.length) historique[id]=d.hist; if(d.plan) planning.push({agentId:id,...d.plan});
      SESSION.last.set(id,JSON.stringify(d)); }catch(err){ console.warn("Dossier illisible",id,err); } }
  agents.sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom));
  let creneaux=[]; const cf=await FS.read("creneaux/"+SESSION.uid+".json");
  if(cf){ CACHE.set("creneaux/"+SESSION.uid+".json",cf); try{ creneaux=await openRing(JSON.parse(cf.text),"creneaux:"+SESSION.uid); }catch(e){} }
  else if(COMMON.creneauxByUser&&COMMON.creneauxByUser[SESSION.uid]) creneaux=COMMON.creneauxByUser[SESSION.uid];
  SESSION.lastCren=cf?JSON.stringify(creneaux):"[]";
  S={agents,autoEvals,entretiens,historique,refFormations:COMMON.refFormations||[],campagne:{...COMMON.campagne,creneaux,planning}};
}
function blobOf(a){ return {agent:a,auto:S.autoEvals[a.id]||null,ent:S.entretiens[a.id]||null,hist:S.historique[a.id]||[],plan:(p=>p?{date:p.date,heure:p.heure}:null)(S.campagne.planning.find(p=>p.agentId===a.id))}; }
function applyBlobToS(id,d){ const i=S.agents.findIndex(a=>a.id===id); if(i>=0) S.agents[i]=d.agent; else { S.agents.push(d.agent); S.agents.sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom)); }
  if(d.auto) S.autoEvals[id]=d.auto; else delete S.autoEvals[id]; if(d.ent) S.entretiens[id]=d.ent; else delete S.entretiens[id]; if(d.hist&&d.hist.length) S.historique[id]=d.hist; else delete S.historique[id];
  S.campagne.planning=S.campagne.planning.filter(p=>p.agentId!==id); if(d.plan) S.campagne.planning.push({agentId:id,...d.plan}); }
function dropAgent(id){ S.agents=S.agents.filter(a=>a.id!==id); delete S.autoEvals[id]; delete S.entretiens[id]; delete S.historique[id]; S.campagne.planning=S.campagne.planning.filter(p=>p.agentId!==id); SESSION.agentKeys.delete(id); SESSION.last.delete(id); }
function diffFields(a,b,pre){ const out=[]; a=a||{}; b=b||{}; for(const k of new Set([...Object.keys(a),...Object.keys(b)])){ if(JSON.stringify(a[k]??null)!==JSON.stringify(b[k]??null)) out.push(pre+k); } return out; }
const BLOB_PARTS={agent:"fiche",auto:"auto-évaluation",ent:"entretien",hist:"historique",plan:"créneau"};

/* --- enregistrement : uniquement ce qui a changé, fusion si un collègue a écrit entre-temps --- */
let persistTimer=null, persistBusy=null;
function save(){ if(!SESSION) return; clearTimeout(persistTimer); persistTimer=setTimeout(persistNow,350); }
async function persistNow(){ if(!SESSION||!S) return; clearTimeout(persistTimer); while(persistBusy) await persistBusy; persistBusy=(async()=>{
  if(RO) return;
  try{ let wrote=false;
    for(const a of S.agents.slice()){ if(skipWrite(a.id)) continue; const d=blobOf(a); const js=JSON.stringify(d); if(SESSION.last.get(a.id)===js && V.agents[a.id] && !SESSION.keysDirty.has(a.id)) continue; if(await writeAgent(a.id,d)) wrote=true; }
    if(!RO_ACCOUNT()){ if(await writeCommon()) wrote=true; if(await writeCreneaux()) wrote=true; }
    if(await writeHead()) wrote=true;
    if(Date.now()-SESSION.modsAt>60000) flushMods();
    if(SESSION.jbuf.length){ await flushJournal(); wrote=true; }
    if(wrote){ await markLast(); dailyBackup(); }
  }catch(e){ console.error(e); if(!RO) toast("Erreur d'enregistrement : "+(e.message||e)); }
  })(); await persistBusy; persistBusy=null; }
function flushMods(){ for(const [id,set] of SESSION.mods){ const a=agentById(id); journal("modification d'un dossier",(a?fullName(a):id)+" — "+[...set].join(", ")); } SESSION.mods.clear(); SESSION.modsAt=Date.now(); }
async function writeAgent(id,mine){
  const path="agents/"+id+".json", uid=SESSION.uid; const cached=CACHE.get(path); const disk=await FS.read(path);
  const base=SESSION.last.get(id)?JSON.parse(SESSION.last.get(id)):null;
  let final=mine, key=SESSION.agentKeys.get(id), keys=V.agents[id]?.keys; const mineKeys=SESSION.keysDirty.has(id);
  if(cached&&!disk){ dropAgent(id); SESSION.conflicts.push({id,txt:"ce dossier a été supprimé par un collègue : vos modifications n'ont pas été enregistrées"}); return false; }
  if(disk&&(!cached||disk.text!==cached.text)){ const rb=JSON.parse(disk.text);
    if(!rb.keys[uid]&&!mineKeys){ dropAgent(id); return false; }
    let theirs=null; if(rb.keys[uid]){ const r=await decryptAgentBlob(id,rb); theirs=r.d; if(!mineKeys){ key=r.k; keys=rb.keys; SESSION.agentKeys.set(id,r.k); } }
    if(theirs){ const merged={}, clash=[]; for(const k of Object.keys(BLOB_PARTS)){ const m=JSON.stringify(mine[k]??null), b=JSON.stringify(base?.[k]??null), t=JSON.stringify(theirs[k]??null);
        if(m===b) merged[k]=theirs[k]??null; else if(t===b||t===m) merged[k]=mine[k]??null; else { merged[k]=theirs[k]??null; clash.push(BLOB_PARTS[k]); } }
      final=merged; applyBlobToS(id,merged);
      if(clash.length){ const who=userById(rb.by); SESSION.conflicts.push({id,txt:`${who?uName(who):"un collègue"} a modifié en même temps : sa version a été gardée pour ${clash.join(", ")} (vos changements sur cette partie ne sont pas enregistrés)`}); } } }
  if(!key){ key=await C.aesNew(); SESSION.agentKeys.set(id,key); keys=await wrapFor(key,recipientsFor(final.agent)); }
  const changed=diffFields(base,final,"").filter(k=>k!=="hist").flatMap(k=>{ const x=base?.[k], y=final[k]; if(x&&y&&typeof x==="object"&&typeof y==="object"&&!Array.isArray(x)){ const sub=diffFields(x,y,"").filter(f=>!["id"].includes(f)); return sub.length?sub.slice(0,12).map(f=>BLOB_PARTS[k]+"."+f):[BLOB_PARTS[k]]; } return [BLOB_PARTS[k]]; }); if(base&&changed.length){ const s=SESSION.mods.get(id)||new Set(); changed.forEach(x=>s.add(x)); SESSION.mods.set(id,s); }
  if(!base){ journal("création d'un dossier agent",fullName(final.agent)); }
  const blob={u:Date.now(),by:uid,...await C.seal(key,final,"agent:"+id+":"+V.id),keys};
  await fsWrite(path,JSON.stringify(blob)); V.agents[id]=blob; SESSION.last.set(id,JSON.stringify(final)); SESSION.keysDirty.delete(id); return true; }
async function writeCommon(){
  if(S){ const {creneaux,planning,...camp}=S.campagne; COMMON.campagne=camp; COMMON.refFormations=S.refFormations||[]; }
  if(COMMON.creneauxByUser) delete COMMON.creneauxByUser;
  const js=JSON.stringify(COMMON); if(SESSION.lastCommon===js&&!SESSION.commonKeysDirty) return false;
  const cached=CACHE.get(F_COMMON); const disk=await FS.read(F_COMMON);
  if(disk&&cached&&disk.text!==cached.text){ const rb=JSON.parse(disk.text);
    if(!rb.keys[SESSION.uid]){ lock("Vos droits sur ce coffre ont été retirés."); return false; }
    const rk=await C.unwrap(rb.keys[SESSION.uid],SESSION.priv); const theirs=await C.open(rk,rb,"common:"+V.id); const base=JSON.parse(SESSION.lastCommon);
    const merged={}; for(const k of new Set([...Object.keys(theirs),...Object.keys(COMMON)])){ const m=JSON.stringify(COMMON[k]??null), b=JSON.stringify(base[k]??null); merged[k]=(m!==b)?COMMON[k]:theirs[k]; }
    merged.ring=[...(theirs.ring||[])]; for(const r of (COMMON.ring||[])) if(!merged.ring.some(x=>x.id===r.id)) merged.ring.push(r);
    COMMON=merged; if(!SESSION.commonKeysDirty){ SESSION.commonKey=rk; V.common.keys=rb.keys; }
    if(S){ const c=COMMON.campagne; S.campagne={...S.campagne,...c,creneaux:S.campagne.creneaux,planning:S.campagne.planning}; S.refFormations=COMMON.refFormations||[]; } }
  V.common={u:Date.now(),by:SESSION.uid,...await C.seal(SESSION.commonKey,COMMON,"common:"+V.id),keys:V.common.keys};
  await fsWrite(F_COMMON,JSON.stringify(V.common)); SESSION.lastCommon=JSON.stringify(COMMON); SESSION.commonKeysDirty=false; return true; }
async function writeCreneaux(){ if(!S) return false; const js=JSON.stringify(S.campagne.creneaux||[]); if(js===SESSION.lastCren) return false; await fsWrite("creneaux/"+SESSION.uid+".json",JSON.stringify(await sealRing(S.campagne.creneaux||[],"creneaux:"+SESSION.uid))); SESSION.lastCren=js; return true; }
function writeVault(){ return persistNow(); }

/* --- relecture périodique du dossier (travail à plusieurs) --- */
let pollTimer=null;
function startPolling(){ clearInterval(pollTimer); pollTimer=setInterval(()=>refreshFromDisk().catch(e=>console.warn(e)),POLL_MS); }
async function refreshFromDisk(manual){ if(!SESSION||!S) return; await persistNow(); if(!SESSION) return; const names=new Set();
  const h=await FS.read(F_HEAD);
  if(h&&h.text!==CACHE.get(F_HEAD)?.text){ const o=JSON.parse(h.text); if(await checkDir(o.users,o.dirMac)){ V.users=o.users; V.deletedUsers=o.deletedUsers||{}; V.dirMac=o.dirMac; ["commune","ville","logo","entete"].forEach(k=>V[k]=o[k]); setOrg(V); CACHE.set(F_HEAD,h); const u=me(); if(!u||!u.actif) return lock("Votre compte a été désactivé par l'administrateur."); } else SESSION.alert="L'annuaire du dossier partagé a été modifié hors de l'application."; }
  const c=await FS.read(F_COMMON);
  if(c&&c.text!==CACHE.get(F_COMMON)?.text){ const rb=JSON.parse(c.text); if(!rb.keys[SESSION.uid]) return lock("Vos droits sur ce coffre ont été retirés.");
    const k=await C.unwrap(rb.keys[SESSION.uid],SESSION.priv); COMMON=await C.open(k,rb,"common:"+V.id); SESSION.commonKey=k; V.common=rb; CACHE.set(F_COMMON,c); SESSION.lastCommon=JSON.stringify(COMMON);
    S.campagne={...S.campagne,...COMMON.campagne,creneaux:S.campagne.creneaux,planning:S.campagne.planning}; S.refFormations=COMMON.refFormations||[]; names.add(userById(rb.by)?uName(userById(rb.by)):""); }
  const seen=new Set(); let n=0;
  for(const e of await FS.list("agents")){ if(e.kind!=="file"||!e.name.endsWith(".json")) continue; const id=e.name.slice(0,-5), path="agents/"+e.name; seen.add(id);
    const f=await e.h.getFile(); const cached=CACHE.get(path); if(cached&&cached.mod===f.lastModified) continue; const text=await f.text(); if(cached&&cached.text===text){ cached.mod=f.lastModified; continue; }
    const a=agentById(id); if(a&&!skipWrite(id)&&JSON.stringify(blobOf(a))!==SESSION.last.get(id)) continue; // modification locale en cours : fusion au prochain enregistrement
    const blob=JSON.parse(text); V.agents[id]=blob; CACHE.set(path,{text,mod:f.lastModified});
    try{ const r=await decryptAgentBlob(id,blob); if(!r){ if(a) dropAgent(id); continue; } SESSION.agentKeys.set(id,r.k); applyBlobToS(id,r.d); SESSION.last.set(id,JSON.stringify(r.d)); n++; const w=userById(blob.by); if(w&&w.id!==SESSION.uid) names.add(uName(w)); }catch(err){} }
  for(const id of [...SESSION.agentKeys.keys()]){ if(!seen.has(id)&&CACHE.has("agents/"+id+".json")){ CACHE.delete("agents/"+id+".json"); dropAgent(id); n++; } }
  await heartbeatLock();
  if(n||names.size){ const who=[...names].filter(Boolean); if(who.length&&!manual) toast("Mis à jour par "+who.join(", ")); softRender(); }
  else if(manual) render(); }
function softRender(){ const ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&document.getElementById("main")?.contains(ae)) { SESSION.pendingRender=true; return; } render(); }
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(SESSION&&SESSION.pendingRender&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"")){ SESSION.pendingRender=false; render(); } },200); });

/* --- verrou par dossier --- */
let LOCKSTATE={id:null,ok:false,by:null,checked:false};
function skipWrite(id){ return RO_ACCOUNT() || (LOCKSTATE.id===id && !LOCKSTATE.ok); }
async function lockInfo(id){ const r=await FS.readJSON("verrous/"+id+".json"); return (r&&r.uid!==SESSION.uid&&Date.now()-r.at<LOCK_TTL)?r:null; }
async function takeLock(id){ try{ await fsWrite("verrous/"+id+".json",JSON.stringify({uid:SESSION.uid,nom:uName(me()),at:Date.now()})); }catch(e){} }
function releaseLock(){ const s=LOCKSTATE; LOCKSTATE={id:null,ok:false,by:null,checked:false}; if(s.id&&s.ok&&SESSION){ const uid=SESSION.uid; FS.readJSON("verrous/"+s.id+".json").then(r=>{ if(r&&r.uid===uid) FS.remove("verrous/"+s.id+".json"); }).catch(()=>{}); } }
function lockFor(id){ if(LOCKSTATE.id===id) return LOCKSTATE; releaseLock(); LOCKSTATE={id,ok:false,by:null,checked:false};
  (async()=>{ const o=await lockInfo(id); if(LOCKSTATE.id!==id) return; if(o) LOCKSTATE={id,ok:false,by:o,checked:true}; else { await takeLock(id); LOCKSTATE={id,ok:true,by:null,checked:true}; } render(); })(); return LOCKSTATE; }
async function heartbeatLock(){ const s=LOCKSTATE; if(!s.id||!s.checked) return; if(s.ok) return takeLock(s.id); const o=await lockInfo(s.id); if(!o&&LOCKSTATE.id===s.id){ await takeLock(s.id); LOCKSTATE={id:s.id,ok:true,by:null,checked:true}; toast("Le dossier est libéré : vous pouvez le modifier"); softRender(); } }

/* --- sauvegarde quotidienne (30 jours) --- */
let backupDone="";
async function dailyBackup(){ const d=today(); if(backupDone===d||RO) return; backupDone=d;
  try{ if(await FS.read(`sauvegardes/${d}/${F_HEAD}`)) return; await makeBackup(`sauvegardes/${d}`); journal("sauvegarde quotidienne",d);
    const limit=new Date(Date.now()-BACKUP_DAYS*86400000).toISOString().slice(0,10); for(const e of await FS.list("sauvegardes")){ if(e.kind==="directory"&&/^\d{4}-\d{2}-\d{2}$/.test(e.name)&&e.name<limit) await FS.remove("sauvegardes/"+e.name,true); } }
  catch(e){ console.warn("sauvegarde",e); backupDone=""; } }
async function makeBackup(dest){ await FS.copyTree("",dest,n=>["sauvegardes","archives","verrous","journal","connexions"].includes(n)); }
async function listBackups(){ return (await FS.list("sauvegardes")).filter(e=>e.kind==="directory").map(e=>e.name).sort().reverse(); }
const DATA_ENTRIES=[F_HEAD,F_COMMON,F_LAST,"agents","creneaux"];
async function archiveCurrent(label){ const dest=`archives/${label}-${new Date().toISOString().replace(/[:.]/g,"-").slice(0,19)}`; await FS.copyTree("",dest,n=>!DATA_ENTRIES.includes(n)); return dest; }
async function restoreBackup(name){ await persistNow(); const arch=await archiveCurrent("avant-restauration"); for(const n of ["agents","creneaux"]) await FS.remove(n,true); await FS.copyTree("sauvegardes/"+name,"",null); journal("restauration de la sauvegarde",name+" (état précédent archivé dans "+arch+")"); await flushJournal(); }
async function resetFolder(){ const arch=await archiveCurrent("remise-a-zero"); for(const n of DATA_ENTRIES) await FS.remove(n,true); await FS.remove("verrous",true); return arch; }

/* --- rotation et distribution des clés --- */
async function rotateAgent(id){ const a=S.agents.find(x=>x.id===id); if(!a) return; const k=await C.aesNew(); SESSION.agentKeys.set(id,k); V.agents[id]={...(V.agents[id]||{}),keys:await wrapFor(k,recipientsFor(a))}; SESSION.keysDirty.add(id); }
async function rotateCommon(){ const k=await C.aesNew(); SESSION.commonKey=k; COMMON.ring=[...(COMMON.ring||[]),newRingEntry()]; V.common={...V.common,keys:await wrapFor(k,commonRecipients())}; SESSION.commonKeysDirty=true; }
async function grantKeysTo(u){ V.common.keys[u.id]=await C.wrap(SESSION.commonKey,u.pub); SESSION.commonKeysDirty=true;
  for(const a of S.agents){ const blob=V.agents[a.id]; const k=SESSION.agentKeys.get(a.id); if(!blob||!k) continue; if(u.role==="admin"||u.role==="lecture"||a.n1Id===u.id){ blob.keys[u.id]=await C.wrap(k,u.pub); SESSION.keysDirty.add(a.id); } } }
async function revokeKeysOf(uid){ delete V.common.keys[uid]; for(const a of S.agents){ const blob=V.agents[a.id]; if(blob&&blob.keys&&blob.keys[uid]) await rotateAgent(a.id); } await rotateCommon(); }

/* --- verrouillage de session --- */
let idleTimer=null;
function bumpIdle(){ if(!SESSION) return; clearTimeout(idleTimer); const m=(COMMON?.settings?.lockMin)||10; idleTimer=setTimeout(()=>lock("Session fermée après "+m+" min d'inactivité."), m*60000); }
async function lock(msg){ if(!SESSION) return; try{ flushMods(); journal("déconnexion",""); await persistNow(); }catch(e){} releaseLock(); clearInterval(pollTimer);
  SESSION=null; S=null; COMMON=null; clearTimeout(idleTimer); fdpReset(); IMP={paie:null,poste:null,target:""}; BULK={paie:null,poste:null}; document.getElementById("print").innerHTML=""; document.querySelectorAll(".modal").forEach(m=>m.remove());
  GATE_MSG=msg||""; if(location.hash) history.replaceState(null,"",baseUrl()); await gateLoad(); }
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,bumpIdle,{passive:true}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&SESSION) persistNow(); });
window.addEventListener("pagehide",()=>{ if(SESSION){ persistNow(); releaseLock(); } });

/* --- export / fusion d'un coffre en fichier unique --- */
function vaultFileName(){ return `coffre-chiffre-entretiens-${slug(VILLE||COMMUNE)}-${today()}.json`; }
async function exportVault(){ await persistNow(); journal("export du coffre chiffré",""); await persistNow(); const o={format:"spv-coffre",v:2,id:V.id,commune:V.commune,ville:V.ville,logo:V.logo,created:V.created,updated:Date.now(),users:V.users,dirMac:V.dirMac,common:V.common,agents:V.agents,tomb:{}}; saveFile(vaultFileName(),JSON.stringify(o),"application/json"); }
async function mergeVault(other){
  if(!other||other.format!=="spv-coffre") throw new Error("Ce fichier n'est pas un coffre exporté.");
  if(other.id!==V.id) throw new Error("Ce coffre appartient à une autre collectivité (identifiant différent).");
  const k=await C.hmacKey(COMMON.dirKey); if(other.dirMac!==await C.mac(k,dirCanon(other.users))) throw new Error("L'annuaire de ce fichier a été altéré : fusion refusée.");
  let n=0; for(const [id,u] of Object.entries(other.users)){ if(V.deletedUsers?.[id]) continue; if(!V.users[id]||(u.updated||0)>(V.users[id].updated||0)){ V.users[id]=u; n++; } }
  await signDir(); await fsWrite(F_HEAD,JSON.stringify(headOf()));
  for(const [id,b] of Object.entries(other.agents)){ if(!V.agents[id]||b.u>V.agents[id].u){ await fsWrite("agents/"+id+".json",JSON.stringify(b)); n++; } }
  if(other.common.u>V.common.u){ await fsWrite(F_COMMON,JSON.stringify(other.common)); n++; }
  return n; }

/* ============================================================
   ÉCRANS D'ACCÈS : création du coffre, connexion, mot de passe
   ============================================================ */
const app=document.getElementById("app");
let GATE_MSG="", NEW_RECOVERY=null, LAST_LOGIN="";
function gateSide(){ return `<div class="side"><img src="${APP_LOGO}" alt="Saint-Privat-des-Vieux"><h1>Entretiens professionnels</h1><p>L'outil de la mairie de Saint-Privat-des-Vieux pour préparer, conduire et exploiter les entretiens annuels, du DGS aux N+1.</p>
  <ul><li>${ico("lock")}<span>Toutes les données sont chiffrées dans ce navigateur (AES-256). Rien n'est envoyé sur Internet.</span></li>
  <li>${ico("users")}<span>Chaque N+1 ne peut ouvrir que les dossiers de ses agents : les clés ne lui sont pas transmises pour les autres.</span></li>
  <li>${ico("shield")}<span>Verrouillage automatique, journal des accès, empreinte d'intégrité des comptes.</span></li></ul>
  <svg class="lockart" viewBox="0 0 24 24" fill="none" stroke-width="1">${ICONS.lock}</svg></div>`; }
function pwField(id,label,autocomplete="new-password",meter=false){ return `<label class="f"><span>${label}</span><input type="password" id="${id}" autocomplete="${autocomplete}" ${meter?`oninput="pwMeter(this)"`:""} required>${meter?`<div class="meter"><i id="${id}_m"></i></div><span class="hint" id="${id}_h">${PW_RULE}</span>`:""}</label>`; }
function pwMeter(el){ const s=pwScore(el.value); const m=document.getElementById(el.id+"_m"); const cols=["var(--red)","var(--red)","var(--amber)","var(--green)","var(--green-2)"]; m.style.width=(el.value?Math.max(10,s*25):0)+"%"; m.style.background=cols[s]; document.getElementById(el.id+"_h").textContent=el.value?["Trop faible","Trop faible","Correct","Solide","Excellent"][s]+(s<2?" — "+PW_RULE:""):PW_RULE; }
function busy(btn,on,label){ if(!btn) return; if(on){ btn._t=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span> ${label||"Chiffrement…"}`; } else { btn.disabled=false; btn.innerHTML=btn._t||btn.innerHTML; } }

let SETUP_LOGO="", GATE={phase:"init"}, FIRST_OK=false;
async function gateLoad(){
  if(AGENT_ONLY) return render();
  if(inFrame || !("showDirectoryPicker" in window)){ GATE={phase:"nofs"}; return render(); }
  if(!FOLDER){ const h=await IDB.get("dossier"); if(!h){ GATE={phase:"pick"}; return render(); } let p="prompt"; try{ p=await h.queryPermission({mode:"readwrite"}); }catch(e){} if(p!=="granted"){ GATE={phase:"resume",h}; return render(); } FOLDER=h; }
  let head=null; try{ CACHE.clear(); head=await readHead(); }catch(e){ GATE={phase:"resume",h:FOLDER,err:e.message}; FOLDER=null; return render(); }
  if(!head){ GATE={phase:GATE.phase==="create"?"create":"first"}; return render(); }
  V={...head,common:null,agents:{}}; setOrg(V);
  GATE={phase:"login",head,last:await FS.readJSON(F_LAST)}; render(); }
async function pickFolder(){ try{ const h=await window.showDirectoryPicker({id:"entretiens-pros",mode:"readwrite"}); FOLDER=h; RO=null; await IDB.set("dossier",h); GATE_MSG=""; GATE={phase:"init"}; await gateLoad(); }catch(e){ if(e.name!=="AbortError") toast("Dossier inaccessible : "+e.message); } }
async function resumeFolder(){ try{ const p=await GATE.h.requestPermission({mode:"readwrite"}); if(p==="granted"){ FOLDER=GATE.h; RO=null; await gateLoad(); } else toast("Autorisation refusée par le navigateur"); }catch(e){ toast(e.message); } }
const pathHTML=()=>`<code class="k">${esc(DEFAULT_PATH)}</code>`;
function renderGate(){
  let body="";
  const fold=FOLDER?`<p class="small muted" style="margin:0 0 .8rem">${ico("file")} Dossier : <b>${esc(FOLDER.name)}</b> · <a href="javascript:void 0" onclick="pickFolder()">changer</a></p>`:"";
  const ph=GATE.phase;
  if(NEW_RECOVERY){ body=`<div class="card"><h2>Votre clé de secours</h2><p>Elle permet de rouvrir le coffre de <b>${esc(COMMUNE)}</b> si le mot de passe administrateur est perdu. <b>Elle ne sera plus jamais affichée.</b> Imprimez-la et rangez-la sous clé.</p>
    <div class="secret">${esc(NEW_RECOVERY)}</div><p class="small muted">Pour l'utiliser : identifiant <code class="k">secours</code>, mot de passe = cette clé.</p>
    <div class="actions"><button class="btn" onclick="printRecovery()">Imprimer</button></div>
    <label class="f" style="flex-direction:row;gap:.55rem;align-items:center;margin-top:1rem"><input type="checkbox" id="rk_ok" onchange="document.getElementById('rk_go').disabled=!this.checked"> J'ai mis la clé de secours en lieu sûr</label>
    <div class="actions"><button class="btn primary" id="rk_go" disabled onclick="NEW_RECOVERY=null;gateLoad()">Continuer vers la connexion</button></div></div>`; }
  else if(ph==="init"){ body=`<div class="card"><p><span class="spin"></span> Ouverture…</p></div>`; }
  else if(ph==="nofs"){ body=`<div class="card"><h2>Ouvrez l'application depuis le lecteur réseau</h2><p>Elle enregistre ses données chiffrées dans un dossier partagé, ce qui demande <b>Google Chrome ou Microsoft Edge</b> et une ouverture directe du fichier (pas depuis une messagerie ni depuis Claude).</p>
    <ol class="small" style="padding-left:1.1rem"><li>Copiez ce fichier HTML dans ${pathHTML()}.</li><li>Dans l'explorateur Windows, clic droit sur le fichier → <b>Ouvrir avec</b> → Chrome (ou Edge).</li><li>Au premier lancement, choisissez ce même dossier quand l'application le demande.</li></ol></div>`; }
  else if(ph==="pick"||ph==="resume"){ body=`<div class="card"><h2>${ph==="resume"?"Reprendre le dossier partagé":"Choisir le dossier partagé"}</h2>
    ${ph==="resume"?`<p>Ce poste utilise le dossier <b>${esc(GATE.h.name)}</b>. Pour des raisons de sécurité, Chrome demande votre accord à chaque ouverture.</p>${GATE.err?`<div class="note warn">${esc(GATE.err)}</div>`:""}<div class="actions"><button class="btn primary" onclick="resumeFolder()">${ico("file")} Reprendre « ${esc(GATE.h.name)} »</button><button class="btn ghost" onclick="pickFolder()">Choisir un autre dossier</button></div>`
    :`<p>Les données de l'application sont rangées, chiffrées, dans le dossier partagé de la collectivité. Sélectionnez-le une fois : ce poste s'en souviendra.</p><p class="small">Dossier prévu : ${pathHTML()}</p><div class="actions"><button class="btn primary" onclick="pickFolder()">${ico("file")} Choisir le dossier</button></div><p class="hint">Chrome demande ensuite d'autoriser la modification des fichiers : acceptez, c'est ce qui permet d'enregistrer.</p>`}</div>`; }
  else if(ph==="first"){ body=`<div class="card"><h2>Première utilisation</h2>${fold}
    <div class="note bad"><b>Attention.</b> Ce dossier ne contient aucun coffre. <b>Si des collègues utilisent déjà l'application, ne créez rien</b> : vous êtes sans doute dans le mauvais dossier, et vous créeriez un coffre séparé que personne d'autre ne verrait. Vérifiez le chemin : ${pathHTML()}.</div>
    <div class="choices"><button class="choice" onclick="pickFolder()"><span class="ic">${ico("file")}</span><b>Choisir un autre dossier</b><span class="small muted">Le coffre de mes collègues est ailleurs.</span></button>
    <label class="choice"><span class="ic">${ico("upload")}</span><b>Reprendre un coffre exporté</b><span class="small muted">Fichier « coffre-chiffre-entretiens-….json » exporté de la version en ligne ou d'un autre poste.</span><input type="file" accept=".json,application/json" style="display:none" onchange="openVaultFile(this)"></label>
    <button class="choice" onclick="if(!document.getElementById('fo_ok').checked){toast('Cochez d’abord la confirmation');return;}GATE.phase='create';render()"><span class="ic">${ico("shield")}</span><b>Créer le coffre de ma collectivité</b><span class="small muted">Vous devenez administrateur et invitez ensuite vos collègues.</span></button></div>
    <label class="ck" style="margin-top:.8rem"><input type="checkbox" id="fo_ok"><span>Je confirme que personne n'utilise encore l'application dans ce dossier</span></label></div>`; }
  else if(ph==="create"){ body=`<div class="card"><h2>Créer le coffre</h2>${fold}<form onsubmit="event.preventDefault();doSetup()">
      <label class="f"><span>Nom de la collectivité</span><input id="su_c" required value="${esc(DEFAULT_COMMUNE)}"></label>
      <div class="row" style="margin-top:.6rem"><label class="f"><span>Lieu de signature des courriers</span><input id="su_v" value="${esc(DEFAULT_VILLE)}"></label>
      <div class="auto" style="display:flex;gap:.5rem;align-items:center"><span id="su_lp"><img src="${SETUP_LOGO||APP_LOGO}" alt="" style="height:40px;border-radius:6px;border:1px solid var(--line);background:#fff;padding:2px"></span><label class="btn small">${ico("upload")} Autre logo<input type="file" accept="image/png,image/jpeg" style="display:none" onchange="pickLogo(this,l=>{SETUP_LOGO=l;document.getElementById('su_lp').innerHTML='<img src=&quot;'+l+'&quot; alt=&quot;&quot; style=&quot;height:40px;border-radius:6px&quot;>';})"></label></div></div>
      <h3 style="margin-top:1.2rem">Compte administrateur</h3>
      <div class="row" style="margin-top:.4rem"><label class="f"><span>Prénom</span><input id="su_p" required autocomplete="given-name"></label><label class="f"><span>Nom</span><input id="su_n" required autocomplete="family-name"></label></div>
      <div class="row" style="margin-top:.6rem"><label class="f"><span>Fonction</span><input id="su_f" placeholder="DGS"></label><label class="f"><span>Identifiant</span><input id="su_l" required autocomplete="username" placeholder="prenom.nom"></label></div>
      ${pwField("su_pw","Mot de passe administrateur","new-password",true)}${pwField("su_pw2","Confirmer le mot de passe")}
      <div class="actions"><button class="btn primary" id="su_go" type="submit">${ico("lock")} Créer le coffre chiffré</button><button class="btn ghost" type="button" onclick="GATE.phase='first';render()">Retour</button></div>
      <p class="hint">La création prend quelques secondes : le navigateur génère les clés de chiffrement.</p></form></div>`; }
  else { const h=GATE.head, last=GATE.last; const nU=Object.values(h.users).filter(u=>!u.recovery).length;
    body=`<div class="card"><div class="who" style="margin-bottom:.4rem">${h.logo?`<img src="${h.logo}" alt="" style="height:46px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:3px">`:""}<div><h2 style="margin:0">${esc(h.commune||"Collectivité")}</h2><span>Entretiens professionnels</span></div></div>
    <dl class="kv small" style="margin:.6rem 0 .3rem"><dt>Dossier</dt><dd>${esc(FOLDER.name)}</dd><dt>Dernier enregistrement</dt><dd>${last?`${esc(last.par||"")} · ${fmtDT(last.le)}`:"—"}</dd><dt>Comptes</dt><dd>${nU}</dd></dl>
    ${GATE_MSG?`<div class="note warn">${esc(GATE_MSG)}</div>`:""}
    <form onsubmit="event.preventDefault();doLogin()"><label class="f"><span>Identifiant ou nom complet</span><input id="lg_l" autocomplete="username" required value="${esc(LAST_LOGIN)}" autocapitalize="none" placeholder="prenom.nom ou Prénom Nom"></label>${pwField("lg_pw","Mot de passe","current-password")}
    <div class="actions"><button class="btn primary" id="lg_go" type="submit">${ico("lock")} Se connecter</button><button class="btn ghost" type="button" onclick="loginHelp()">Je n'arrive pas à me connecter</button></div></form>
    <p class="small muted" style="margin-top:.8rem"><a href="javascript:void 0" onclick="pickFolder()">Changer de dossier</a></p></div>`; }
  app.innerHTML=`<div class="gate">${gateSide()}<div class="form">${body}</div></div>`;
  const f=document.getElementById(LAST_LOGIN?"lg_pw":"lg_l")||document.getElementById("su_c"); if(f) f.focus();
}
function loginHelp(){ const us=Object.values(GATE.head.users).filter(u=>!u.recovery).sort((a,b)=>(a.nom||"").localeCompare(b.nom||""));
  const o=modal(`<h3>Je n'arrive pas à me connecter</h3><p class="small">Comptes enregistrés dans ce dossier :</p><div class="scroll"><table class="t"><thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>État</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.prenom)} ${esc(u.nom)}</td><td><code class="k">${esc(u.login)}</code></td><td class="small">${{admin:"Administrateur",n1:"N+1",lecture:"Lecture seule"}[u.role]||u.role}</td><td>${u.actif?(u.mustChange?'<span class="chip warn">provisoire</span>':'<span class="chip ok">actif</span>'):'<span class="chip bad">désactivé</span>'}</td></tr>`).join("")}</tbody></table></div>
  <ul class="small" style="padding-left:1.1rem"><li>Vous pouvez saisir l'identifiant ou le nom complet (« Prénom Nom »).</li><li>Le mot de passe distingue majuscules et minuscules : vérifiez la touche Verr. Maj.</li><li>Mot de passe oublié : demandez à un administrateur de le réinitialiser (Accès et sécurité). Il vous donnera un mot de passe provisoire.</li><li>Administrateur sans mot de passe : identifiant <code class="k">secours</code> et la clé de secours imprimée à la création.</li><li>Après 5 erreurs, la connexion est bloquée quelques minutes sur ce poste.</li><li>Vous ne voyez pas votre nom ? Vérifiez que vous êtes dans le bon dossier : ${pathHTML()}.</li></ul>
  <details style="margin-top:.6rem"><summary class="small red"><b>Remise à zéro du dossier</b></summary><p class="small">Dernier recours, si plus personne ne peut se connecter et que la clé de secours est perdue. Le coffre actuel est <b>archivé</b> (copie dans « archives ») puis retiré : l'application repart à vide. Les données archivées restent illisibles sans un ancien mot de passe.</p><label class="f"><span>Tapez REMISE A ZERO pour confirmer</span><input id="rz_t" autocomplete="off"></label><div class="actions"><button class="btn danger" id="rz_go">Archiver et remettre à zéro</button></div></details>
  <div class="actions"><button class="btn primary" id="lh_ok">Fermer</button></div>`);
  o.querySelector("#lh_ok").onclick=()=>o.remove();
  o.querySelector("#rz_go").onclick=async()=>{ if(o.querySelector("#rz_t").value.trim().toUpperCase()!=="REMISE A ZERO") return toast("Tapez exactement REMISE A ZERO"); try{ const arch=await resetFolder(); o.remove(); GATE_MSG=""; toast("Ancien coffre archivé dans "+arch); GATE={phase:"init"}; await gateLoad(); }catch(e){ toast("Échec : "+e.message); } }; }
async function doSetup(){ const g=id=>document.getElementById(id).value.trim(); const pw=document.getElementById("su_pw").value, pw2=document.getElementById("su_pw2").value;
  if(!pwOk(pw)) return toast("Mot de passe trop faible. "+PW_RULE); if(pw!==pw2) return toast("Les deux mots de passe diffèrent");
  const login=g("su_l").toLowerCase(); if(!/^[a-z0-9._-]{3,40}$/.test(login)) return toast("Identifiant : lettres minuscules, chiffres, point ou tiret");
  const b=document.getElementById("su_go"); busy(b,true,"Génération des clés…");
  const commune=g("su_c"); if(!commune) return toast("Indiquez le nom de la collectivité");
  try{ if(await readHead()){ busy(b,false); toast("Un coffre existe déjà dans ce dossier"); return gateLoad(); }
    NEW_RECOVERY=await createVault({prenom:g("su_p"),nom:g("su_n").toUpperCase(),fonction:g("su_f"),login,pass:pw,commune,ville:g("su_v")||commune.replace(/^(commune|ville|mairie)\s+(de\s+|d'|du\s+)?/i,""),logo:SETUP_LOGO}); setOrg(V); SETUP_LOGO=""; LAST_LOGIN=login; render(); }
  catch(e){ console.error(e); busy(b,false); toast("Échec de la création : "+e.message); } }
function printRecovery(){ printDoc("Cle_de_secours",`<div class="page cred"><div class="pf-head">${orgHead()}</div><h2>Clé de secours du coffre « Entretiens professionnels »</h2><p>Coffre ${esc(V?.id||"")} · créé le ${fmtDate(today())}</p><p>Identifiant : <b>secours</b></p><div class="secretp">${esc(NEW_RECOVERY)}</div><p>Ce document donne un accès administrateur à toutes les données d'évaluation. À conserver sous clé, hors de portée. Ne pas photographier, ne pas transmettre par e-mail.</p></div>`,true); }
async function doLogin(){ const b=document.getElementById("lg_go"); const l=document.getElementById("lg_l").value, p=document.getElementById("lg_pw").value; busy(b,true,"Déverrouillage…");
  try{ const u=await login(l,p); LAST_LOGIN=u.login; GATE_MSG=""; bumpIdle(); if(location.hash.startsWith("#kiosk")) history.replaceState(null,"",baseUrl()); render(); fdpInit(); if(!SESSION.dirOk) setTimeout(()=>toast("Alerte : l'annuaire des comptes a été modifié hors de l'application"),300); }
  catch(e){ console.warn(e); busy(b,false); GATE_MSG=e.message; const n=document.querySelector(".gate .note"); if(n) n.textContent=e.message; else document.querySelector(".gate form").insertAdjacentHTML("beforebegin",`<div class="note warn">${esc(e.message)}</div>`); document.getElementById("lg_pw").value=""; document.getElementById("lg_pw").focus(); } }
function openVaultFile(inp){ const f=inp.files[0]; if(!f) return; inp.value=""; f.text().then(async t=>{ try{ const o=JSON.parse(t); if(await readHead()) return toast("Ce dossier contient déjà un coffre"); await importVaultExport(o); GATE_MSG="Coffre repris dans le dossier partagé. Connectez-vous avec vos identifiants habituels."; await gateLoad(); }catch(e){ toast(e.message||"Fichier invalide"); } }); }

function renderChangePw(forced){ const u=me();
  app.innerHTML=`<div class="gate">${gateSide()}<div class="form"><div class="card"><h2>${forced?"Choisissez votre mot de passe":"Changer de mot de passe"}</h2><p>${forced?`Bienvenue ${esc(u.prenom||"")}. Le mot de passe provisoire doit être remplacé par un mot de passe personnel que vous seul connaissez.`:""}</p>
  <form onsubmit="event.preventDefault();doChangePw()">${pwField("cp_old",forced?"Mot de passe provisoire":"Mot de passe actuel","current-password")}${pwField("cp_new","Nouveau mot de passe","new-password",true)}${pwField("cp_new2","Confirmer")}
  <div class="actions"><button class="btn primary" id="cp_go" type="submit">Enregistrer</button><button class="btn ghost" type="button" onclick="lock()">Annuler et quitter</button></div></form></div></div></div>`; document.getElementById("cp_old").focus(); }
async function doChangePw(){ const u=me(); const o=document.getElementById("cp_old").value, n=document.getElementById("cp_new").value, n2=document.getElementById("cp_new2").value;
  if(!pwOk(n)) return toast("Mot de passe trop faible. "+PW_RULE); if(n!==n2) return toast("Les deux mots de passe diffèrent"); if(n===o) return toast("Choisissez un mot de passe différent");
  const b=document.getElementById("cp_go"); busy(b,true);
  try{ u.priv=await C.reprotect(u.priv,u.recovery?normCode(o):o,n); u.mustChange=false; u.updated=Date.now(); await signDir(); journal("changement de mot de passe",""); await persistNow(); toast("Mot de passe enregistré"); render(); }
  catch(e){ busy(b,false); toast("Mot de passe actuel incorrect"); } }

/* ============================================================
   ROUTAGE ET ARMATURE
   ============================================================ */
window.addEventListener("hashchange", render);
function route(){ const h=location.hash.replace(/^#/,"")||"accueil"; const [v,p,c]=h.split("/"); return {v,p,c}; }
let after=[];
const LOCK_VIEWS=["entretien","agent","import"];
function render(){
  if(AGENT_ONLY){ renderAgentPublic(); return; }
  const {v,p}=route();
  if(!SESSION){ releaseLock(); renderGate(); return; }
  if(me()?.mustChange){ renderChangePw(true); return; }
  if(SESSION.kiosk){ if(v==="kiosk"&&p===SESSION.kiosk){ renderKiosk(p); return; } lock("Appareil rendu : reconnectez-vous pour reprendre."); return; }
  if(v==="kiosk"){ location.hash="#autoevals"; return; }
  const views={accueil:[vAccueil], agents:[vAgents], agent:[vAgentProfil], import:[vImport,"importer"], planning:[vPlanning,"planifier"], convocations:[vConvocations,"planifier"], autoevals:[vAutoEvals,"evaluer"], entretien:[vEntretien,"evaluer"], synthese:[vSynthese,"synthese"], admin:[vAdmin,"admin"], reglages:[vReglages]};
  let [fn,right]=views[v]||[vAccueil];
  const ro=RO_ACCOUNT();
  const allowed = right==="admin" ? isAdmin() : (!right || can(right) || (ro && ["evaluer","synthese"].includes(right)));
  if(!allowed) fn=()=>`<header><h1>Accès non autorisé</h1><p>Votre compte n'a pas le droit d'ouvrir cette page. L'administrateur peut vous l'accorder.</p></header>`;
  let banner="", wrapRO=ro;
  if(RO) banner+=`<div class="robar bad">${ico("lock")} <b>Lecture seule</b> — ${esc(RO)} <button class="btn small" onclick="retryWrite()">Réessayer</button></div>`;
  if(ro) banner+=`<div class="robar">${ico("eye")} <b>Compte en lecture seule</b> — vous consultez sans pouvoir modifier.</div>`;
  if(LOCK_VIEWS.includes(v)&&p&&allowed&&!ro&&!RO){ const ls=lockFor(p); if(!ls.checked){ wrapRO=true; banner+=`<div class="robar">${ico("lock")} Vérification que personne d'autre ne modifie ce dossier…</div>`; } else if(!ls.ok){ wrapRO=true; banner+=`<div class="robar warn">${ico("lock")} <b>Lecture seule</b> — ${esc(ls.by.nom)} modifie ce dossier depuis ${new Date(ls.by.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}. Il redeviendra modifiable dès qu'il l'aura quitté.</div>`; } }
  else if(LOCKSTATE.id) releaseLock();
  if(RO) wrapRO=true;
  if(SESSION.conflicts&&SESSION.conflicts.length) banner+=`<div class="robar bad">${ico("users")} <b>Modification simultanée détectée</b><ul style="margin:.3rem 0 .3rem 1.2rem;padding:0">${SESSION.conflicts.map(c=>{ const a=agentById(c.id); return `<li>${esc(a?fullName(a):c.id)} : ${esc(c.txt)}.</li>`; }).join("")}</ul><button class="btn small" onclick="SESSION.conflicts=[];refreshFromDisk(true)">Recharger</button> <button class="btn small ghost" onclick="SESSION.conflicts=[];render()">J'ai compris</button></div>`;
  if(SESSION.alert) banner+=`<div class="robar bad">${ico("shield")} ${esc(SESSION.alert)}</div>`;
  const body=fn(p);
  app.innerHTML = `<div class="shell">${rail(v)}<main class="main" id="main">${banner}${wrapRO?`<fieldset class="ro" disabled>${body}</fieldset>`:body}</main></div>`;
  if(after.length){ const a=after; after=[]; a.forEach(f=>f()); }
}
async function retryWrite(){ RO=null; try{ await FS.write(F_LAST+".test","ok"); await FS.remove(F_LAST+".test"); toast("Écriture rétablie"); await persistNow(); }catch(e){ RO="Le dossier partagé reste inaccessible en écriture ("+(e.name||e.message)+")."; } render(); }
function rail(v){
  const u=me(); const nbPlan=S.campagne.planning.length, nbAuto=Object.keys(S.autoEvals).length, nbEnt=Object.keys(S.entretiens).length;
  const l=(id,n,label,badge,icon)=>`<a href="#${id}" class="${v===id||(id==="agents"&&v==="agent")?'active':''}"><span class="n ${icon?"ic":""}">${icon?ico(icon):n}</span>${label}${badge?`<span class="badge">${badge}</span>`:""}</a>`;
  return `<aside class="rail">
    <div class="brand"><img src="${ORG_LOGO||APP_LOGO}" alt="${esc(COMMUNE)}"><div><div class="commune">Entretiens professionnels</div><div class="sub">Campagne ${S.campagne.annee}</div><div class="sub">${{admin:"Administration",n1:"Espace N+1",lecture:"Lecture seule"}[u.role]||""}</div></div></div>
    <nav class="nav">
      ${l("accueil","","Accueil","", "home")}
      ${can("planifier")||can("evaluer")||can("synthese")||RO_ACCOUNT()?`<div class="grp">Le cycle</div>`:""}
      ${can("planifier")?l("planning","1","Planifier",nbPlan||""):""}
      ${can("planifier")?l("convocations","1b","Convocations"):""}
      ${can("evaluer")?l("autoevals","2","Auto-évaluations",nbAuto||""):""}

let SCOPE="mine";
const agentById = id => S.agents.find(a=>a.id===id);
const fullName = a => a ? `${a.prenom} ${a.nom}` : "";
function isMine(a){ return a.n1Id===SESSION.uid || (isAdmin() && (!a.n1Id || !userById(a.n1Id) || !userById(a.n1Id).actif)); }
function perScope(){ const per=S.agents.filter(a=>a.perimetre); return (isAdmin()&&SCOPE==="all")? per : per.filter(isMine); }
function scopeToggle(){ if(!isAdmin()) return ""; const mine=S.agents.filter(a=>a.perimetre&&isMine(a)).length, all=S.agents.filter(a=>a.perimetre).length;
  return `<div class="inline-list" style="margin:-.4rem 0 1rem"><span class="small muted">Afficher :</span><button class="btn small ${SCOPE==="mine"?"primary":""}" onclick="SCOPE='mine';render()">Mes agents (${mine})</button><button class="btn small ${SCOPE==="all"?"primary":""}" onclick="SCOPE='all';render()">Tous les N+1 (${all})</button></div>`; }
function stageOf(a){ const p=S.campagne.planning.some(x=>x.agentId===a.id), au=!!S.autoEvals[a.id], e=S.entretiens[a.id]; return [p,au,!!e,e?.statut==="valide"]; }
function stageDots(a){ const st=stageOf(a); return `<span class="dots" title="Planifié · Auto-évaluation · Entretien · Validé">${st.map((x,i)=>`<i class="${x?(i===3?"done":"on"):""}"></i>`).join("")}</span>`; }

  const legacy=isAdmin()&&legacyPlain();

  return `<header><h1>Bonjour ${esc(u.prenom||uName(u))}</h1><p>Campagne ${S.campagne.annee}. ${isAdmin()?"Vous voyez tous les dossiers en tant qu'administrateur.":`Vous suivez ${S.agents.length} agent(s).`}</p></header>
  ${SESSION.dirOk===false?`<div class="note bad"><b>Alerte d'intégrité :</b> l'annuaire des comptes a été modifié en dehors de l'application. Vérifiez la liste des accès dans « Accès et sécurité » ${isAdmin()?`puis <button class="btn small" onclick="resignDir()">confirmer l'annuaire actuel</button>`:"et prévenez l'administrateur"}.</div>`:""}
  ${fdpBanner()}
  ${legacy?`<div class="note warn"><b>Des données de l'ancienne version sont stockées en clair sur ce poste.</b> Reprenez-les dans le coffre chiffré, puis effacez la copie en clair. <div class="actions"><button class="btn small primary" onclick="migrateLegacy()">Reprendre et effacer la copie en clair</button></div></div>`:""}
  ${onboarding?`<div class="card"><h3>Pour démarrer</h3><div class="three">
    <div><h4>1. Charger les agents</h4><p class="small muted">Reprenez le fichier de données initiales ou une sauvegarde de l'ancienne version, ou créez chaque agent à partir de sa fiche de poste et de sa fiche de paie.</p><div class="inline-list"><label class="btn small">${ico("upload")} Données initiales (.json)<input type="file" accept=".json" style="display:none" onchange="importSeed(this)"></label><a class="btn small" href="#import">Fiches de poste / paie</a></div></div>
    <div><h4>2. Ouvrir les accès N+1</h4><p class="small muted">Dans « Accès et sécurité », désignez les agents qui encadrent et donnez-leur un compte avec les droits voulus.</p><a class="btn small" href="#admin">Gérer les accès</a></div>
    <div><h4>3. Lancer la campagne</h4><p class="small muted">Plages de disponibilité, planning automatique, convocations avec QR code.</p><a class="btn small" href="#planning">Planifier</a></div></div></div>`:""}
  ${scopeToggle()}
  <div class="pipe">${stage("#planning","1 · Planifier",cnt(0),"créneaux attribués")}${stage("#autoevals","2 · Recueillir",cnt(1),"auto-évaluations reçues")}${stage("#entretien","3 · Conduire",cnt(2),"entretiens saisis")}${stage("#synthese","4 · Arbitrer",cnt(3),"comptes rendus validés")}</div>
  <div class="card"><h3>Suivi par agent</h3><div class="scroll"><table class="t"><thead><tr><th>Agent</th><th>Grade</th><th>N+1</th><th>Créneau</th><th>Avancement</th><th></th></tr></thead><tbody>
  ${per.map(a=>{const p=S.campagne.planning.find(x=>x.agentId===a.id); return `<tr><td><div class="who"><span class="avatar">${initials(a.prenom,a.nom)}</span><div><b>${esc(a.nom)} ${esc(a.prenom)}</b><span>${esc(a.fichePoste?.intitule||a.service||"")}</span></div></div></td><td class="muted small">${esc(a.grade)}</td><td class="small">${esc(n1Label(a))}</td><td>${p?fmtDate(p.date)+" "+p.heure:'<span class="muted">—</span>'}</td><td>${stageDots(a)}</td><td>${can("evaluer")?`<a class="btn small" href="#entretien/${a.id}">Ouvrir</a>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="muted">Aucun agent dans votre périmètre${isAdmin()?" : cochez « Campagne » dans la liste des agents.":"."}</td></tr>`}
  </tbody></table></div></div>`;

    <td style="white-space:nowrap"><a class="btn small ghost" href="#agent/${a.id}">Profil</a></td></tr>`; }).join("")||`<tr><td colspan="8"><div class="empty">Aucun agent. ${can("importer")?`<a href="#import">Créez un profil depuis une fiche de poste et une fiche de paie</a>.`:""}</div></td></tr>`; }
function updAgent(id,k,v){ if(!isAdmin()) return; const a=agentById(id); a[k]=v; save(); if(k==="perimetre"||k==="encadrant") render(); }
async function setN1(id,uid){ if(!isAdmin()) return; const a=agentById(id); a.n1Id=uid; a.n1=n1Label(a); await rotateAgent(id); journal("affectation N+1",fullName(a)+" → "+(uid?uName(userById(uid)):"aucun")); await persistNow(); SESSION.forceWrite=true; await persistNow(); toast("Dossier re-chiffré pour "+(uid?uName(userById(uid)):"les administrateurs seuls")); }
function newAgentId(){ return "a"+Date.now().toString(36)+randCode(3).toLowerCase(); }
function addAgent(){ const id=newAgentId(); S.agents.push({id,nom:"NOUVEL",prenom:"Agent",categorie:"C",filiere:"Administrative",service:"",grade:"",qualite:"Titulaire",echelon:"",n1Id:SESSION.uid,tempsTravail:"35h00",perimetre:true}); journal("création manuelle d'agent",""); save(); location.hash="#agent/"+id; }
async function delAgent(id){ const a=agentById(id); if(!await ask(`Supprimer définitivement le dossier de ${fullName(a)} ? Sa clé de chiffrement est détruite : les données deviennent irrécupérables, y compris dans les anciens exports.`,"Supprimer",true)) return;
  S.agents=S.agents.filter(x=>x.id!==id); delete S.autoEvals[id]; delete S.entretiens[id]; delete S.historique[id]; S.campagne.planning=S.campagne.planning.filter(p=>p.agentId!==id);
  delete V.agents[id]; SESSION.agentKeys.delete(id); SESSION.last.delete(id); await FS.remove("agents/"+id+".json"); CACHE.delete("agents/"+id+".json"); await FS.remove("verrous/"+id+".json"); releaseLock(); journal("suppression d'un dossier agent",fullName(a)); await persistNow(); location.hash="#agents"; }
function setPerimetre(on){ S.agents.forEach(a=>a.perimetre=on); save(); render(); }

function vPlanning(){

  const per=perScope();
  const slots=computeSlots();
  return `<header><h1>Planifier</h1><p>Définissez vos plages de disponibilité et la durée d'un entretien : le planning se génère pour vos agents, puis les convocations s'éditent en un clic.</p></header>${scopeToggle()}

    <label class="f sm"><span>Pause (min)</span><input type="number" value="${c.pause}" min="0" step="5" onchange="updCamp('pause',+this.value)"></label>
    <label class="f"><span>Lieu</span><input type="text" value="${esc(c.lieu)}" onchange="updCamp('lieu',this.value)"></label>

  <div class="card"><h3>Plages de disponibilité</h3>
    <div class="row"><label class="f sm"><span>Date</span><input type="date" id="cr_date"></label><label class="f sm"><span>Début</span><input type="time" id="cr_deb" value="09:00"></label><label class="f sm"><span>Fin</span><input type="time" id="cr_fin" value="12:00"></label><button class="btn auto" onclick="addCreneau()">Ajouter la plage</button></div>

  </div>
  <div class="card"><h3>Planning</h3>

function updCamp(k,v){ S.campagne[k]=v; save(); }
function addCreneau(){ const d=document.getElementById("cr_date").value,deb=document.getElementById("cr_deb").value,fin=document.getElementById("cr_fin").value; if(!d||!deb||!fin||fin<=deb){toast("Plage invalide");return;} S.campagne.creneaux.push({date:d,debut:deb,fin:fin}); S.campagne.creneaux.sort((a,b)=>(a.date+a.debut).localeCompare(b.date+b.debut)); save(); render(); }
function delCreneau(i){ S.campagne.creneaux.splice(i,1); save(); render(); }
function computeSlots(){ const c=S.campagne, out=[]; const step=(c.duree||60)+(c.pause||0); for(const k of c.creneaux){ let [h,m]=k.debut.split(":").map(Number); const [fh,fm]=k.fin.split(":").map(Number); const end=fh*60+fm; let t=h*60+m; while(t+(c.duree||60)<=end){ out.push({date:k.date,heure:String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}); t+=step; } } return out; }
function genPlanning(){ const slots=computeSlots(); const per=S.agents.filter(a=>a.perimetre&&isMine(a)).sort((a,b)=>a.nom.localeCompare(b.nom)); const used=new Set(S.campagne.planning.filter(p=>{ const x=agentById(p.agentId); return x&&isMine(x); }).map(p=>p.date+"T"+p.heure)); let i=0,n=0; for(const a of per){ if(S.campagne.planning.some(p=>p.agentId===a.id)) continue; while(i<slots.length && used.has(slots[i].date+"T"+slots[i].heure)) i++; if(i>=slots.length) break; S.campagne.planning.push({agentId:a.id,date:slots[i].date,heure:slots[i].heure}); used.add(slots[i].date+"T"+slots[i].heure); n++; } save(); render(); const reste=per.filter(a=>!S.campagne.planning.some(p=>p.agentId===a.id)).length; toast(n+" créneau(x) attribué(s)"+(reste?" · "+reste+" agent(s) sans créneau : ajoutez des plages":"")); }
async function clearPlanning(){ if(!await ask("Retirer tous les créneaux attribués à vos agents ?")) return; S.campagne.planning=S.campagne.planning.filter(p=>{ const x=agentById(p.agentId); return x&&!isMine(x); }); save(); render(); }
function assignSlot(id,v){ S.campagne.planning=S.campagne.planning.filter(p=>p.agentId!==id); if(v){ const [date,heure]=v.split("T"); S.campagne.planning.push({agentId:id,date,heure}); } save(); render(); }
function exportICS(){ const c=S.campagne; const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SPV//Entretiens//FR"]; for(const p of c.planning){ const a=agentById(p.agentId); if(!a) continue; const st=p.date.replace(/-/g,"")+"T"+p.heure.replace(":","")+"00"; const [h,m]=p.heure.split(":").map(Number); const e=h*60+m+(c.duree||60); const et=p.date.replace(/-/g,"")+"T"+String(Math.floor(e/60)).padStart(2,"0")+String(e%60).padStart(2,"0")+"00"; lines.push("BEGIN:VEVENT",`UID:${p.agentId}-${st}@spv`,`DTSTART:${st}`,`DTEND:${et}`,`SUMMARY:Entretien professionnel – ${fullName(a)}`,`LOCATION:${c.lieu}`,"END:VEVENT"); } lines.push("END:VCALENDAR"); saveFile("entretiens-"+c.annee+".ics",lines.join("\r\n"),"text/calendar"); }

/* La page publique : même fichier, sans coffre, avec un paquet de questionnaires chiffrés */
async function buildAgentPage(progress){
  const per=S.agents.filter(a=>a.perimetre); ensureCodes(per); await persistNow();
  const salt=u8b64(rnd(16)); const entries={}; let i=0;
  for(const a of per){ const h=S.historique[a.id]||[]; const last=h[h.length-1];
    const payload={id:a.id,prenom:a.prenom,nom:a.nom,grade:a.grade,echelon:a.echelon,n1:n1Label(a),objPrec:(last?.objAVenir||[]),missions:(a.fichePoste?.missions||[]).slice(0,12)};
    const m=await C.codeMaterial(a.code,salt,CODE_ITER); entries[m.tag]=await C.seal(m.key,payload,"spv-quest"); i++; progress&&progress(i,per.length); }
  const pack={annee:S.campagne.annee,commune:COMMUNE,ville:VILLE,logo:ORG_LOGO,mailRetour:S.campagne.mailRetour||"",iter:CODE_ITER,salt,intakePub:COMMON.intakePub,entries,generated:today()};
  document.querySelectorAll(".modal").forEach(m=>m.remove());
  let src=document.documentElement.outerHTML;
  src=src.replace(/<div id="app">[\s\S]*?<div id="print">[\s\S]*?<div class="toast"/,'<div id="app"></div><div id="print"></div><div class="toast"');
  src=src.replace(/<script[^>]*data-lib[^>]*>[\s\S]*?<\/script>/g,"").replace(/]*>/g,"");
  src=src.replace(/ data-theme="[^"]*"/,"").replace(/<title>[^<]*<\/title>/,"<title>Préparer mon entretien professionnel · "+esc(COMMUNE)+"</title>");
  src=src.replace(/const AGENT_ONLY = (true|false);/,"const AGENT_ONLY = true;").replace(/const AGENT_PACK = .*;/,()=>"const AGENT_PACK = "+JSON.stringify(pack)+";");
  COMMON.pageGen={at:Date.now(),n:per.length}; journal("génération de la page questionnaire",per.length+" agents"); await persistNow();
  return "<!DOCTYPE html>\n"+src; }
async function exportAgentPage(){ const b=document.getElementById("genPage"); busy(b,true,"Chiffrement des questionnaires…");
  try{ const html=await buildAgentPage((i,n)=>{ if(b) b.innerHTML=`<span class="spin"></span> Chiffrement ${i} / ${n}…`; }); busy(b,false); await saveFile("questionnaire-entretien-"+slug(VILLE||COMMUNE)+".html",html,"text/html"); render(); }

async function importCode(txt){ const t=(txt||document.getElementById("imp_code").value).trim(); if(!t) return;
  try{ let o; const m=t.replace(/\s+/g,"").match(/^SPV2:(.+)$/);
    if(m){ const pkg=JSON.parse(dec.decode(b64u8(m[1]))); o=await C.openFrom(COMMON.intakePriv,pkg); }
    else { try{ o=JSON.parse(t); }catch(e){ o=JSON.parse(decodeURIComponent(escape(atob(t)))); } if(!await ask("Ce code n'est pas chiffré (ancienne version du questionnaire). L'importer quand même ?")) return; }
    acceptAuto(o); }
  catch(e){ console.warn(e); toast("Code illisible ou destiné à une autre collectivité"); } }
function importFile(inp){ const f=inp.files[0]; if(!f) return; f.text().then(t=>importCode(t)); inp.value=""; }
function acceptAuto(o){ if(!o||!o.agentId||!agentById(o.agentId)){ toast("Cet agent ne fait pas partie des dossiers qui vous sont confiés"); return; } if(o.v===2) Object.assign(o,autoToText(o)); S.autoEvals[o.agentId]=o; journal("import d'une auto-évaluation",fullName(agentById(o.agentId))); save(); render(); toast("Auto-évaluation de "+fullName(agentById(o.agentId))+" importée"); }
async function delAuto(id){ if(await ask("Supprimer cette auto-évaluation ?","Supprimer",true)){ delete S.autoEvals[id]; save(); render(); } }
