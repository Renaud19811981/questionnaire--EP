async function startKiosk(id){ const a=agentById(id); if(!await ask(`Confier l'appareil à ${fullName(a)} ? Seul son questionnaire sera affiché. À la fin, l'outil se verrouille : il faudra votre mot de passe pour reprendre.`,"Confier l'appareil")) return; SESSION.kiosk=id; journal("questionnaire sur place",fullName(a)); location.hash="#kiosk/"+id; }
function renderKiosk(id){ const a=agentById(id); const h=S.historique[id]||[]; const last=h[h.length-1];
  QA={agent:{id:a.id,prenom:a.prenom,nom:a.nom,grade:a.grade,echelon:a.echelon,n1:n1Label(a),objPrec:last?.objAVenir||[],missions:(a.fichePoste?.missions||[]).slice(0,12)}, mode:"kiosk", step:QA&&QA.agent?.id===id?QA.step:0, ans:QA&&QA.agent?.id===id?QA.ans:freshAnswers(S.autoEvals[id])};
  renderQuest(); }

function makeQR(elId,text,size){ const el=document.getElementById(elId); if(!el) return; const u=qrDataUrl(text,size); el.innerHTML=u?`<img src="${u}" width="${size}" height="${size}" alt="QR code">`:`<span class="small muted">QR indisponible – utilisez le lien</span>`; }
function qrDataUrl(text,size){ try{ const q=qrcode(0,"M"); q.addData(text); q.make(); const n=q.getModuleCount(); const cell=Math.max(3,Math.round((size||120)/n)); return q.createDataURL(cell,cell*2); }catch(e){ return ""; } }
function printCSS(){ let out=""; try{ for(const ss of document.styleSheets){ for(const r of ss.cssRules){ if(r.media&&[...r.media].includes("print")) out+=[...r.cssRules].map(x=>x.cssText).join("\n"); } } }catch(e){} return out; }
function printDoc(title,inner){ const pr=document.getElementById("print"); pr.innerHTML=inner;
  if(!inFrame){ setTimeout(()=>window.print(),300); return; }
  const doc=`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{margin:0;background:#fff;color:#000;font:11pt "Atkinson Hyperlegible Next",Arial,sans-serif;line-height:1.4}#print{display:block}${printCSS()}.bar{position:sticky;top:0;background:#1E5CA3;color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;font-family:Arial,sans-serif;font-size:14px}.bar button{font:inherit;padding:6px 12px;border:0;border-radius:4px;background:#fff;color:#1E5CA3;font-weight:700;cursor:pointer}@media print{.bar{display:none}}@page{margin:12mm}</style></head><body><div class="bar"><button onclick="window.print()">Imprimer / enregistrer en PDF</button><span>${esc(title)} · ${COMMUNE}</span></div><div id="print">${inner}</div><script>window.addEventListener("load",()=>setTimeout(()=>window.print(),600));<\/script></body></html>`;
  saveFile(title.replace(/[^\w\d-]+/g,"_")+".html",doc,"text/html"); }
/* ============================================================
   QUESTIONNAIRE DE PRÉPARATION (agent) — presque tout en cases à cocher
   Utilisé sur place (appareil confié) et dans la page publique.
   ============================================================ */
let QA=null;
function freshAnswers(p){ p=(p&&p.v===2)?p:{}; return {obj:{...(p.objStatut||{})},resAuto:p.resAuto||"",facteurs:[...(p.facteurs||[])],satisf:{...(p.satisf||{})},positifs:[...(p.positifs||[])],difficultes:[...(p.difficultes||[])],amelior:[...(p.amelior||[])],fpAdequation:p.fpAdequation||"",
  fnone:!!p.fnone,fsuiv:(p.formSuivies||[]).map(f=>f.intitule),fsuivAutre:"",benef:[...(p.benef||[])],fsouh:(p.formSouhaits||[]).map(f=>f.intitule),fsouhAutre:"",cpf:!!p.cpf,projets:Object.fromEntries((p.projets||[]).filter(x=>x.key).map(x=>[x.key,x.precision||""])),commentaire:p.commentaire||""}; }
const lbl=(list,k)=>(list.find(x=>x[0]===k)||[,k])[1];
const lowerFirst=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
function autoToText(o){
  const objLines=(o.objectifs||[]).filter(x=>x.statut).map(x=>`« ${x.libelle} » : ${x.statut.toLowerCase()}`);
  const fac=(o.facteurs||[]).map(k=>lowerFirst(lbl(Q_FACTEURS,k)));
  const byLv=[3,2,1,0].map(n=>[n,Q_SATISF.filter(([k])=>o.satisf?.[k]===n).map(([,l])=>lowerFirst(l))]).filter(([,l])=>l.length);
  const sat=byLv.map(([n,l])=>`${Q_SATISF_LV[n]} : ${l.join(", ")}.`);
  const pos=(o.positifs||[]).map(k=>lowerFirst(lbl(Q_POSITIFS,k))), dif=(o.difficultes||[]).map(k=>lowerFirst(lbl(Q_DIFFICULTES,k)));
  const am=(o.amelior||[]).map(k=>lowerFirst(lbl(Q_AMELIOR,k)));
  const fpa={oui:"Ma fiche de poste correspond à mon travail réel.",partie:"Ma fiche de poste ne correspond qu'en partie à mon travail réel.",non:"Ma fiche de poste ne correspond pas à mon travail réel."}[o.fpAdequation]||"";
  const ben=(o.benef||[]).map(k=>lowerFirst(lbl(Q_BENEF,k)));
  return {
    obsAgent:[objLines.length?"Objectifs – "+objLines.join(" ; ")+".":"", fac.length?"Contexte de l'année : "+fac.join(", ")+".":""].filter(Boolean).join("\n"),
    satisfaction:[...sat, pos.length?"Ce que j'apprécie : "+pos.join(", ")+".":"", dif.length?"Difficultés rencontrées : "+dif.join(", ")+".":""].filter(Boolean).join("\n"),
    suggestions:[am.length?"Pistes d'amélioration : "+am.join(", ")+".":"", fpa].filter(Boolean).join("\n"),
    autresObs:o.commentaire||"",
    benefAgent:o.fnone?"Aucune formation suivie cette année.":(ben.length?ben.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(". ")+".":"")
  }; }
function refItemOf(t){ const r=refList().find(i=>refLabel(i)===t||i.intitule===t); return r?{intitule:refLabel(r),jours:r.jours||"",type:r.type||"",cpf:false}:{intitule:t,jours:"",type:"",cpf:false}; }
function buildAuto(){ const A=QA.agent, a=QA.ans; const annee=AGENT_ONLY?AGENT_PACK.annee:S.campagne.annee;
  const extra=t=>(t||"").split(/\n|;/).map(x=>x.trim()).filter(Boolean);
  const o={v:2,agentId:A.id,annee,date:today(),objStatut:{...a.obj},objectifs:(A.objPrec||[]).map((l,i)=>({libelle:l,statut:a.obj[i]||""})),resAuto:a.resAuto,facteurs:[...a.facteurs],satisf:{...a.satisf},positifs:[...a.positifs],difficultes:[...a.difficultes],amelior:[...a.amelior],fpAdequation:a.fpAdequation,
    fnone:a.fnone,benef:[...a.benef],cpf:a.cpf,commentaire:a.commentaire.trim(),
    formSuivies:a.fnone?[]:[...a.fsuiv.map(refItemOf),...extra(a.fsuivAutre).map(t=>({intitule:t,jours:"",type:"",cpf:false}))],
    formSouhaits:[...a.fsouh.map(refItemOf),...extra(a.fsouhAutre).map(t=>({intitule:t,jours:"",type:"",cpf:false}))].map(f=>({...f,cpf:a.cpf&&["5","6",""].includes(f.type)})),
    projets:Object.entries(a.projets).map(([k,prec])=>{ const P=Q_PROJETS.find(x=>x[0]===k)||[k,k,"Autre"]; return {key:k,precision:prec,souhait:P[1]+(prec?" – "+prec:""),cat:P[2]}; })};
  return Object.assign(o,autoToText(o)); }

/* --- composants --- */
const qid=s=>"q"+Math.abs([...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7));
function ckList(field,list,col){ const sel=QA.ans[field]; return `<div class="cks ${col?"col":""}">${list.map(([k,l])=>`<label class="ck"><input type="checkbox" ${sel.includes(k)?"checked":""} onchange="qToggle('${field}','${k}',this.checked)"><span>${esc(l)}</span></label>`).join("")}</div>`; }
function rdList(name,opts,cur,on){ return `<div class="cks">${opts.map(o=>`<label class="ck"><input type="radio" name="${name}" ${cur===o?"checked":""} onchange="(${on})(${JSON.stringify(o).replace(/"/g,"&quot;")})"><span>${esc(o)}</span></label>`).join("")}</div>`; }
function qToggle(f,k,on){ const a=QA.ans[f]; const i=a.indexOf(k); if(on&&i<0) a.push(k); if(!on&&i>=0) a.splice(i,1); qDraft(); }
function catalog(field){ const list=refList(); const doms=[...new Set(list.map(i=>i.dom))]; const sel=QA.ans[field];
  return `<input type="search" placeholder="Rechercher une formation…" oninput="catFilter(this,'${field}')" style="margin-bottom:.6rem"><div id="cat_${field}">${doms.map(d=>{ const items=list.filter(i=>i.dom===d); const n=items.filter(i=>sel.includes(refLabel(i))).length; return `<details class="cat" ${n?"open":""}><summary>${esc(d)}<span class="c" data-c>${n?n+" choisie"+(n>1?"s":""):""}</span></summary><div class="cks col">${items.map(i=>{ const t=refLabel(i); return `<label class="ck" data-t="${esc(norm(t))}"><input type="checkbox" ${sel.includes(t)?"checked":""} onchange="qToggle('${field}',${JSON.stringify(t).replace(/"/g,"&quot;")},this.checked);catCount(this)"><span>${esc(i.intitule)}${i.jours?` <small class="muted">· ${esc(i.jours)}${/h$/.test(i.jours)?"":" j"}</small>`:""}</span></label>`; }).join("")}</div></details>`; }).join("")}</div>`; }
function catCount(el){ const d=el.closest("details"); const n=d.querySelectorAll("input:checked").length; d.querySelector("[data-c]").textContent=n?n+" choisie"+(n>1?"s":""):""; }
function catFilter(inp,field){ const q=norm(inp.value); document.querySelectorAll(`#cat_${field} details`).forEach(d=>{ let any=false; d.querySelectorAll(".ck").forEach(l=>{ const ok=!q||l.dataset.t.includes(q); l.style.display=ok?"":"none"; if(ok) any=true; }); d.style.display=any?"":"none"; if(q&&any) d.open=true; }); }

function questHead(){ const A=QA.agent; const annee=AGENT_ONLY?AGENT_PACK.annee:S.campagne.annee;
  return `<div class="top"><img src="${orgLogo()}" alt="${esc(COMMUNE)}"><div><h1>Préparer mon entretien ${annee}</h1><p>${esc(A.prenom)} ${esc(A.nom)} · ${esc(A.grade||"")}${A.n1?" · avec "+esc(A.n1):""}${QA.mode==="public"?` · <a href="#auto" onclick="forgetCode()">ce n'est pas moi</a>`:""}</p></div></div>`; }
function rgpdNotice(){ return `<details class="rgpd"><summary>Vos données et leur protection</summary><p style="margin:.5rem 0 0">${esc(COMMUNE)||"La collectivité"} recueille ces réponses pour préparer votre entretien professionnel (code général de la fonction publique, art. L521-1 ; décret n° 2014-1526). Elles sont lues par votre responsable direct et la direction générale, puis reprises dans le compte rendu versé à votre dossier. Elles sont chiffrées sur cet appareil et transmises chiffrées : personne d'autre ne peut les lire. N'indiquez aucune information médicale. Vous pouvez y accéder, les faire rectifier ou effacer auprès de la direction générale ou du délégué à la protection des données, et saisir la CNIL.</p></details>`; }

function renderQuest(){
  const A=QA.agent, a=QA.ans, st=QA.step; const N=Q_STEPS.length;
  let body="";
  if(st===0){ body=`<h2>Mes objectifs de l'an dernier</h2><p class="lead">Cochez où vous en êtes. Aucune phrase à rédiger.</p>
    <div class="qblock"><h3>Objectif par objectif</h3>${A.objPrec?.length?A.objPrec.map((o,i)=>`<div class="objrow"><div class="t">${esc(o)}</div>${rdList("o"+i,Q_OBJ,a.obj[i],`v=>{QA.ans.obj[${i}]=v;qDraft()}`)}</div>`).join(""):`<p class="hint">Aucun objectif n'avait été enregistré lors du dernier entretien.</p>`}</div>
    <div class="qblock"><h3>Dans l'ensemble, mes objectifs ont été…</h3>${rdList("resAuto",RESULTATS,a.resAuto,"v=>{QA.ans.resAuto=v;qDraft()}")}</div>
    <div class="qblock"><h3>Ce qui a compté cette année</h3><p class="hint">Plusieurs choix possibles. N'indiquez aucune information médicale.</p>${ckList("facteurs",Q_FACTEURS)}</div>`; }
  else if(st===1){ body=`<h2>Mon année</h2><p class="lead">Un clic par ligne, selon votre ressenti.</p>
    <div class="qblock"><h3>Ma satisfaction</h3><div class="seglegend">${Q_SATISF_SHORT.map((l,i)=>`<span><i style="background:var(--${["red","amber","green","green-2"][i]})"></i>${l}</span>`).join("")}</div>
    ${Q_SATISF.map(([k,l])=>`<div class="lik"><div class="q">${esc(l)}</div><div class="seg" role="radiogroup" aria-label="${esc(l)}">${Q_SATISF_SHORT.map((s,n)=>`<label class="s${n}"><input type="radio" name="${k}" ${a.satisf[k]===n?"checked":""} onchange="QA.ans.satisf['${k}']=${n};qDraft()"><span>${s}</span></label>`).join("")}</div></div>`).join("")}</div>
    <div class="qblock"><h3>Ce que j'apprécie</h3>${ckList("positifs",Q_POSITIFS)}</div>
    <div class="qblock"><h3>Ce qui est difficile</h3>${ckList("difficultes",Q_DIFFICULTES)}</div>`; }
  else if(st===2){ body=`<h2>Mon poste</h2><p class="lead">Ce qui pourrait améliorer votre quotidien de travail.</p>
    ${A.missions?.length?`<div class="qblock"><h3>Ma fiche de poste</h3><ul class="missions">${A.missions.map(m=>`<li>${esc(m)}</li>`).join("")}</ul><p class="hint" style="margin-top:.6rem">Elle correspond à mon travail réel :</p>${["oui","partie","non"].map(k=>`<label class="ck"><input type="radio" name="fpa" ${a.fpAdequation===k?"checked":""} onchange="QA.ans.fpAdequation='${k}';qDraft()"><span>${{oui:"Oui",partie:"En partie",non:"Non"}[k]}</span></label>`).join(" ")}</div>`:""}
    <div class="qblock"><h3>Pistes d'amélioration</h3><p class="hint">Cochez celles qui vous parlent.</p>${ckList("amelior",Q_AMELIOR)}</div>`; }
  else if(st===3){ body=`<h2>Formation</h2><p class="lead">Les formations proposées sont des repères du catalogue CNFPT.</p>
    <div class="qblock"><h3>Formations suivies cette année</h3><label class="ck" style="margin-bottom:.6rem"><input type="checkbox" ${a.fnone?"checked":""} onchange="QA.ans.fnone=this.checked;document.getElementById('fsuivBox').hidden=this.checked;qDraft()"><span>Je n'ai suivi aucune formation</span></label>
      <div id="fsuivBox" ${a.fnone?"hidden":""}>${catalog("fsuiv")}<label class="f" style="margin-top:.5rem"><span>Autre formation suivie (facultatif)</span><input type="text" value="${esc(a.fsuivAutre)}" oninput="QA.ans.fsuivAutre=this.value;qDraft()" placeholder="intitulé"></label>
      <h3 style="margin-top:1rem">Ce qu'elles m'ont apporté</h3>${ckList("benef",Q_BENEF)}</div></div>
    <div class="qblock"><h3>Formations souhaitées pour l'année à venir</h3>${catalog("fsouh")}<label class="f" style="margin-top:.5rem"><span>Autre souhait (facultatif)</span><input type="text" value="${esc(a.fsouhAutre)}" oninput="QA.ans.fsouhAutre=this.value;qDraft()" placeholder="intitulé"></label>
      <label class="ck" style="margin-top:.7rem"><input type="checkbox" ${a.cpf?"checked":""} onchange="QA.ans.cpf=this.checked;qDraft()"><span>Je souhaite mobiliser mon compte personnel de formation (CPF)</span></label></div>`; }
  else if(st===4){ const cats=[...new Set(Q_PROJETS.map(p=>p[2]))]; body=`<h2>Mes projets</h2><p class="lead">Carrière, mobilité, organisation du travail… Cochez, et précisez en quelques mots si vous le souhaitez.</p>
    ${cats.map(c=>`<div class="qblock"><h3>${esc(c)}</h3><div class="cks col">${Q_PROJETS.filter(p=>p[2]===c).map(([k,l])=>`<div><label class="ck"><input type="checkbox" ${k in a.projets?"checked":""} onchange="qProj('${k}',this.checked)"><span>${esc(l)}</span></label><div class="prec" id="pr_${k}" ${k in a.projets?"":"hidden"}><input type="text" value="${esc(a.projets[k]||"")}" placeholder="Précision (facultatif)" oninput="QA.ans.projets['${k}']=this.value;qDraft()"></div></div>`).join("")}</div></div>`).join("")}`; }
  else { const o=buildAuto(); const nsat=Object.keys(a.satisf).length;
    body=`<h2>Vérifier et envoyer</h2><p class="lead">Un dernier mot si vous le souhaitez, puis envoyez.</p>
    <div class="qblock"><h3>Commentaire libre (facultatif)</h3><textarea oninput="QA.ans.commentaire=this.value;qDraft()" placeholder="Ce que vous souhaitez aborder pendant l'entretien…">${esc(a.commentaire)}</textarea></div>
    <div class="qblock"><h3>Récapitulatif</h3><dl class="recap">
      <dt>Objectifs</dt><dd>${esc(a.resAuto||"non renseigné")}${Object.keys(a.obj).length?` · ${Object.keys(a.obj).length} objectif(s) détaillé(s)`:""}</dd>
      <dt>Satisfaction</dt><dd>${nsat?`${nsat} / ${Q_SATISF.length} critères renseignés`:"non renseignée"}</dd>
      <dt>Pistes d'amélioration</dt><dd>${a.amelior.length||"aucune"}</dd>
      <dt>Formations souhaitées</dt><dd>${o.formSouhaits.length?o.formSouhaits.map(f=>esc(f.intitule)).join(" ; "):"aucune"}</dd>
      <dt>Projets</dt><dd>${o.projets.length?o.projets.map(p=>esc(p.souhait)).join(" ; "):"aucun"}</dd></dl>
      <div class="actions"><button class="btn small" onclick="qGo(0)">Modifier mes réponses</button></div></div>
    <div id="qDone"></div>`; }
  app.innerHTML=`<div class="agent-mode">${questHead()}<div class="qprog"><div class="steps">${Q_STEPS.map((s,i)=>`<i class="${i<st?"done":i===st?"on":""}"></i>`).join("")}</div><div class="lbl"><span>Étape ${st+1} sur ${N} · ${Q_STEPS[st]}</span><span>${QA.mode==="public"?"Brouillon chiffré sur cet appareil":"Sur place"}</span></div></div>
  ${st===0?rgpdNotice():""}<div class="qstep">${body}</div></div>
  <div class="qnav"><div class="in"><button class="btn" ${st===0?"disabled":""} onclick="qGo(${st-1})">Précédent</button>${st<N-1?`<button class="btn primary" onclick="qGo(${st+1})">Suivant</button>`:`<button class="btn primary" id="qSend" onclick="submitQuest()">${QA.mode==="public"?"Terminer et obtenir mon code de retour":"Terminer et enregistrer"}</button>`}</div></div>`;
}
function qGo(n){ QA.step=Math.max(0,Math.min(Q_STEPS.length-1,n)); qDraft(); renderQuest(); window.scrollTo(0,0); }
function qProj(k,on){ if(on) QA.ans.projets[k]=QA.ans.projets[k]||""; else delete QA.ans.projets[k]; const d=document.getElementById("pr_"+k); if(d) d.hidden=!on; qDraft(); }
let draftT=null;
function qDraft(){ if(QA.mode!=="public"||!QA.mat) return; clearTimeout(draftT); draftT=setTimeout(async()=>{ try{ const box=await C.seal(QA.mat.key,{ans:QA.ans,step:QA.step},"spv-brouillon"); localStorage.setItem("spv_brouillon_"+QA.mat.tag,JSON.stringify(box)); }catch(e){} },500); }
async function submitQuest(){ const b=document.getElementById("qSend"); const o=buildAuto(); const box=document.getElementById("qDone");
  if(QA.mode==="kiosk"){ S.autoEvals[o.agentId]=o; await persistNow();
    document.querySelector(".qnav").remove(); box.innerHTML=`<div class="qblock" style="border-color:var(--green-2)"><h3>Merci, vos réponses sont enregistrées</h3><p>Elles pré-remplissent la fiche d'entretien de votre responsable. Vous pouvez lui rendre l'appareil.</p><div class="actions"><button class="btn primary" onclick="lock('Appareil rendu : reconnectez-vous pour reprendre.')">${ico("lock")} Rendre l'appareil (verrouiller)</button></div></div>`; box.scrollIntoView({behavior:"smooth"}); return; }
  busy(b,true,"Chiffrement…");
  try{ const pkg=await C.sealFor(AGENT_PACK.intakePub,o); const code="SPV2:"+u8b64(enc.encode(JSON.stringify(pkg))); qDraft(); busy(b,false);
    const A=QA.agent, to=AGENT_PACK.mailRetour||"";
    box.innerHTML=`<div class="qblock" style="border-color:var(--green-2)"><h3>Votre préparation est prête</h3><p>Transmettez ce code de retour à votre responsable : copiez-le dans un e-mail, ou envoyez le fichier. Il est chiffré : seule la collectivité peut le lire.</p><textarea class="code" id="autoCode" readonly>${esc(code)}</textarea>
      <div class="actions"><button class="btn primary" onclick="copyText(document.getElementById('autoCode').value,document.getElementById('autoCode'))">Copier le code</button><a class="btn" href="mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent("Préparation entretien "+AGENT_PACK.annee+" – "+A.prenom+" "+A.nom)}&body=${encodeURIComponent("Bonjour,\n\nVoici mon code de retour chiffré pour l'entretien professionnel :\n\n"+code+"\n\nCordialement,\n"+A.prenom+" "+A.nom)}">Ouvrir un e-mail pré-rempli</a><button class="btn" onclick="saveFile('retour-entretien-${esc(norm(A.nom).replace(/[^a-z0-9]+/g,"-"))}.txt',document.getElementById('autoCode').value,'text/plain')">Télécharger le fichier</button></div>
      <p class="hint">Vos réponses restent modifiables sur cet appareil : rouvrez le lien, corrigez, puis renvoyez le nouveau code.</p></div>`; box.scrollIntoView({behavior:"smooth"}); }
  catch(e){ console.error(e); busy(b,false); toast("Échec du chiffrement : "+e.message); } }

/* --- page publique : ouverture par code --- */
function forgetCode(){ try{ sessionStorage.removeItem("spv_code"); }catch(e){} QA=null; }
async function renderAgentPublic(){
  const P=AGENT_PACK; const {v,p}=route();
  if(!P){ app.innerHTML=`<div class="agent-mode"><div class="empty">Cette page n'a pas été générée correctement.</div></div>`; return; }
  let code=""; if(v==="auto"&&p&&normCode(p).length>=10){ code=normCode(p); history.replaceState(null,"",baseUrl()+"#auto"); }
  if(!code){ try{ code=sessionStorage.getItem("spv_code")||""; }catch(e){} }
  if(QA&&QA.mode==="public"&&(!code||QA.code===code)){ renderQuest(); return; }
  if(!code){ app.innerHTML=`<div class="agent-mode"><div class="top"><img src="${orgLogo()}" alt="${esc(COMMUNE)}"><div><h1>Préparer mon entretien professionnel ${P.annee}</h1><p>Questionnaire à compléter avant le rendez-vous avec votre responsable.</p></div></div>
    <div class="qblock"><form onsubmit="event.preventDefault();const c=normCode(document.getElementById('acc').value);if(c.length<10){toast('Le code compte 10 caractères');return;}try{sessionStorage.setItem('spv_code',c)}catch(e){};QA=null;renderAgentPublic()"><label class="f"><span>Mon code d'accès</span><input id="acc" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" placeholder="XXXXX-XXXXX" style="font-family:ui-monospace,Menlo,monospace;font-size:1.35rem;letter-spacing:.15em;text-transform:uppercase"></label><p class="hint">Il figure sur votre convocation, sous le QR code. Il n'ouvre que votre questionnaire.</p><div class="actions"><button class="btn primary" type="submit">${ico("lock")} Ouvrir mon questionnaire</button></div></form>${GATE_MSG?`<p class="hint red">${esc(GATE_MSG)}</p>`:""}</div>${rgpdNotice()}</div>`; GATE_MSG=""; return; }
  app.innerHTML=`<div class="agent-mode"><div class="top"><img src="${orgLogo()}" alt="${esc(COMMUNE)}"><div><h1>Ouverture sécurisée…</h1><p>Déchiffrement de votre questionnaire sur cet appareil.</p></div></div><p><span class="spin"></span></p></div>`;
  try{ const mat=await C.codeMaterial(code,P.salt,P.iter); const e=P.entries[mat.tag]; if(!e) throw new Error("absent");
    const agent=await C.open(mat.key,e,"spv-quest"); let ans=freshAnswers(null), step=0;
    try{ const d=localStorage.getItem("spv_brouillon_"+mat.tag); if(d){ const o=await C.open(mat.key,JSON.parse(d),"spv-brouillon"); ans=Object.assign(ans,o.ans); step=o.step||0; } }catch(err){}
    try{ sessionStorage.setItem("spv_code",code); }catch(err){}
    QA={agent,mode:"public",step,ans,mat,code}; renderQuest(); }
  catch(err){ try{ sessionStorage.removeItem("spv_code"); }catch(e2){} GATE_MSG="Code inconnu : vérifiez les 10 caractères inscrits sur votre convocation."; QA=null; renderAgentPublic(); }
}

function setE(id,k,v,el){ const E=S.entretiens[id]; E[k]=v; if(E.src&&E.src[k]){ delete E.src[k]; if(el){ el.classList.remove("prefilled"); const s=el.previousElementSibling?.querySelector(".src"); if(s) s.remove(); } } save(); }
function setCrit(id,group,k,v){ S.entretiens[id][group][k]=v; save(); renderSugg(id); }
function fillCrit(id,n){ const E=S.entretiens[id]; CRITERES.forEach(g=>g.items.forEach(([k])=>E.crit[k]=n)); if(E.encadrement) CRIT_ENC.forEach(([k])=>E.critEnc[k]=n); save(); render(); }
function copyCritFrom(id){ const h=S.historique[id]||[]; const last=h[h.length-1]; if(!last) return; const E=S.entretiens[id]; E.crit={...(last.crit||{})}; E.critEnc={...(last.critEnc||{})}; E.audela={...(last.audela||{})}; save(); render(); }
function saveEntretien(id,statut){ const E=S.entretiens[id]; E.formSuivies=readDyn("efsuiv"); E.formSouhaits=readDyn("efsouh"); E.projets=readDyn("eproj"); if(statut) E.statut=statut; if(E.src){ delete E.src.formSuivies; delete E.src.formSouhaits; delete E.src.projets; } save(); render(); toast(statut==="valide"?"Compte rendu validé":"Brouillon enregistré"); }
async function resetEntretien(id){ if(!await ask("Effacer la saisie de cet entretien et repartir de l'historique + auto-évaluation ?")) return; delete S.entretiens[id]; save(); render(); }

/* --- moteur de pré-appréciations --- */
function suggestions(E,a){ const h=S.historique[a.id]||[]; const last=h[h.length-1]; const out=[];
  const vals=CRITERES.flatMap(g=>g.items.map(([k])=>E.crit[k])).filter(v=>v!==undefined);
  const n=vals.length, moy=n?vals.reduce((s,v)=>s+v,0)/n:null;
  const faibles=CRITERES.flatMap(g=>g.items).filter(([k])=>E.crit[k]!==undefined&&E.crit[k]<=1).map(([,l])=>l.toLowerCase());
  const forts=CRITERES.flatMap(g=>g.items).filter(([k])=>E.crit[k]===3).map(([,l])=>l.toLowerCase());
  const audela=AUDELA.filter(([k])=>E.audela[k]).map(([,l])=>l.toLowerCase().replace(/^a /,"a ").replace(/^s'est/,"s'est"));
  const nom=a.prenom+" "+a.nom;
  const res=E.resSup||E.resAuto;
  const resTxt={"Dépassés":"les objectifs fixés ont été dépassés","Atteints":"les objectifs fixés ont été atteints","Partiellement atteints":"les objectifs fixés ont été partiellement atteints, en lien avec la charge d'activité du service","Non-atteints":"les objectifs fixés n'ont pas pu être atteints cette année","Devenus sans objets":"les objectifs fixés sont devenus sans objet"}[res]||"";
  if(moy===null && !last){ return [{lab:"En attente", txt:"Renseignez la grille d'évaluation pour obtenir des propositions d'appréciation."}]; }
  // 1. factuelle
  let t1=`${nom} obtient une évaluation ${moy>=2.7?"très satisfaisante":moy>=2?"satisfaisante":moy>=1.2?"globalement satisfaisante, avec des axes de progrès":"insuffisante"} sur l'ensemble des critères.`;
  if(resTxt) t1+=` Sur l'année écoulée, ${resTxt}.`;
  if(forts.length) t1+=` Les points forts relevés portent sur : ${forts.slice(0,3).join(", ")}.`;
  if(faibles.length) t1+=` Un axe d'amélioration est identifié sur : ${faibles.join(", ")}.`;
  out.push({lab:"Formulation factuelle",txt:t1});
  // 2. valorisante
  if(moy===null||moy>=2){ let t2=`${nom} fait preuve d'un investissement constant au service de la collectivité.`;
    if(forts.some(f=>/fiabilit|rigueur|organisation/.test(f))) t2+=` Sa rigueur et la fiabilité de son travail garantissent une gestion de qualité des dossiers qui lui sont confiés.`;
    if(forts.some(f=>/initiative|efficacit/.test(f))) t2+=` Son sens de l'initiative et son souci d'efficacité lui permettent de proposer des solutions pertinentes.`;
    if(forts.some(f=>/équipe|solidarit|publics/.test(f))) t2+=` Ses qualités relationnelles et son esprit d'équipe en font un élément sur lequel le service peut s'appuyer en toute confiance.`;
    if(audela.length) t2+=` Au-delà des critères de base, il est à souligner que l'agent ${audela[0]}.`;
    if(E.encadrement){ const ev=CRIT_ENC.map(([k])=>E.critEnc[k]).filter(v=>v!==undefined); if(ev.length&&ev.reduce((s,v)=>s+v,0)/ev.length>=2.5) t2+=` Ses capacités d'encadrement, d'animation et de structuration de l'activité confirment son aptitude à exercer des responsabilités élargies.`; }
    out.push({lab:"Formulation valorisante",txt:t2}); }
  // 3. continuité avec l'année précédente
  if(last?.appreciation){ let t3=`Dans la continuité de l'année précédente, ${nom} confirme ${moy===null||moy>=2.5?"la dynamique relevée lors du dernier entretien":"les qualités relevées lors du dernier entretien"}.`;
    if(resTxt) t3+=` ${resTxt.charAt(0).toUpperCase()+resTxt.slice(1)}.`;
    if(faibles.length) t3+=` Une attention particulière sera portée cette année sur : ${faibles.join(", ")}.`;
    t3+=` Rappel de l'appréciation ${last.annee} : « ${last.appreciation.length>220?last.appreciation.slice(0,220)+"…":last.appreciation} »`;
    out.push({lab:`Continuité avec ${last.annee}`,txt:t3}); }
  // 4. progression
  if(faibles.length||(moy!==null&&moy<2)){ let t4=`${nom} assure ses missions avec sérieux. L'année a été marquée par ${resTxt||"une charge d'activité soutenue"}. Pour l'année à venir, un accompagnement est proposé sur ${faibles.length?faibles.join(" et "):"les objectifs non aboutis"}, avec des points d'étape réguliers avec le N+1.`; out.push({lab:"Axée progression",txt:t4}); }
  return out; }

function entretienContext(a){ const fp=a.fichePoste, au=S.autoEvals[a.id]; const v2=au&&au.v===2;
  if(!fp&&!v2) return "";
  const tags=(arr,list)=>(arr||[]).length?`<div class="tags">${arr.map(k=>`<span>${esc(lbl(list,k))}</span>`).join("")}</div>`:`<span class="muted small">—</span>`;
  return `<div class="two">${fp?`<details class="box" open><summary>Fiche de poste · ${esc(fp.intitule||"")}</summary>${fp.missions?.length?`<ul class="missions">${fp.missions.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:`<p class="muted small">Missions non renseignées.</p>`}${fp.competences?.length?`<p class="small muted" style="margin:.6rem 0 .2rem">Compétences attendues</p><div class="tags">${fp.competences.slice(0,10).map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:""}</details>`:"<div></div>"}
  ${v2?`<details class="box" open><summary>Ce que l'agent a coché (${fmtDate(au.date)})</summary>
    <div class="mini-likert">${Q_SATISF.filter(([k])=>au.satisf?.[k]!==undefined).map(([k,l])=>`<div><span>${esc(l)}</span><span class="lv l${au.satisf[k]}">${Q_SATISF_SHORT[au.satisf[k]]}</span></div>`).join("")||`<span class="muted small">Satisfaction non renseignée.</span>`}</div>
    <p class="small muted" style="margin:.7rem 0 .2rem">Contexte de l'année</p>${tags(au.facteurs,Q_FACTEURS)}
    <p class="small muted" style="margin:.6rem 0 .2rem">Difficultés</p>${tags(au.difficultes,Q_DIFFICULTES)}
    <p class="small muted" style="margin:.6rem 0 .2rem">Pistes d'amélioration</p>${tags(au.amelior,Q_AMELIOR)}
    ${au.fpAdequation?`<p class="small" style="margin-top:.6rem">Fiche de poste conforme au travail réel : <b>${{oui:"oui",partie:"en partie",non:"non"}[au.fpAdequation]}</b></p>`:""}</details>`:"<div></div>"}</div>`; }
function missionChips(id,a){ const m=a.fichePoste?.missions||[]; if(!m.length) return ""; return `<div class="inline-list" style="margin:.2rem 0 .8rem"><span class="small muted">Partir d'une mission de la fiche de poste :</span>${m.slice(0,8).map((x,i)=>`<button class="btn small ghost" onclick="addObjFromMission('${id}',${i})" title="${esc(x)}">+ ${esc(x.length>48?x.slice(0,46)+"…":x)}</button>`).join("")}</div>`; }
function addObjFromMission(id,i){ const a=agentById(id); const t=a.fichePoste.missions[i]; const E=S.entretiens[id]; E.objAVenir=(E.objAVenir?E.objAVenir.trim()+"\n":"")+t; save(); render(); toast("Objectif ajouté : précisez-le et ajoutez son indicateur"); }

function fillDiag(){ FS.readJSON(F_LAST).then(l=>{ const e=document.getElementById("diagLast"); if(e) e.textContent=l?`${l.par} · ${fmtDT(l.le)}`:"—"; }); }
function setTheme(k){ if(k==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",k); try{ localStorage.setItem("spv_theme",k); }catch(e){} render(); }
function mergeVaultFile(inp){ const f=inp.files[0]; if(!f) return; f.text().then(async t=>{ try{ const o=JSON.parse(t); await persistNow(); const n=await mergeVault(o); journal("fusion d'un fichier coffre",n+" élément(s)"); await lock(`Fusion terminée (${n} élément(s) plus récents repris). Reconnectez-vous pour charger les données à jour.`); }catch(e){ toast(e.message||"Fichier invalide"); } }); inp.value=""; }
async function archiveCampagne(){ const n=Object.values(S.entretiens).filter(e=>e.statut==="valide").length; if(!await ask(`Archiver ${n} entretien(s) validé(s) dans l'historique et passer à la campagne ${S.campagne.annee+1} ?`)) return;
  for(const [id,E] of Object.entries(S.entretiens)){ if(E.statut!=="valide") continue; (S.historique[id]=S.historique[id]||[]).push({annee:E.annee,objAVenir:(E.objAVenir||"").split("\n").filter(Boolean),indicateurs:E.indicateurs,resSup:E.resSup,crit:E.crit,critEnc:E.critEnc,audela:E.audela,encadrement:E.encadrement,appreciation:E.appreciation,formSouhaits:E.formSouhaits,projets:E.projets,duree:E.duree}); delete S.entretiens[id]; delete S.autoEvals[id]; }
  S.campagne.annee++; S.campagne.creneaux=[]; S.campagne.planning=[]; journal("clôture de campagne",String(S.campagne.annee-1)); save(); render(); toast("Campagne archivée"); }

/* --- reprise de données (fichier initial, sauvegarde de la v1, copie en clair locale) --- */
async function ingest(o){ if(!o||!Array.isArray(o.agents)) throw new Error("Fichier non reconnu");
  let n=0,skip=0; const ids=new Set(S.agents.map(a=>a.id));
  for(const x of o.agents){ if(ids.has(x.id)){ skip++; continue; } const {code,...rest}=x; S.agents.push({service:x.service||x.filiere,tempsTravail:x.tempsTravail||"",...rest,n1Id:x.n1Id||SESSION.uid,n1:x.n1||"",perimetre:x.perimetre!==undefined?!!x.perimetre:!!(o.historique&&o.historique[x.id])}); n++; }
  for(const [id,h] of Object.entries(o.historique||{})) if(!S.historique[id]&&S.agents.some(a=>a.id===id)) S.historique[id]=h;
  for(const [id,e] of Object.entries(o.autoEvals||{})) if(!S.autoEvals[id]) S.autoEvals[id]=e;
  for(const [id,e] of Object.entries(o.entretiens||{})) if(!S.entretiens[id]) S.entretiens[id]=e;
  if(o.campagne){ const c=o.campagne; ["annee","dateCourrier","lieu","signataire","duree","pause","mailRetour"].forEach(k=>{ if(c[k]!==undefined&&c[k]!=="") S.campagne[k]=c[k]; }); if(!S.campagne.creneaux.length&&c.creneaux) S.campagne.creneaux=c.creneaux; (c.planning||[]).forEach(p=>{ if(!S.campagne.planning.some(q=>q.agentId===p.agentId)) S.campagne.planning.push(p); }); }
  if(o.refFormations&&!S.refFormations?.length) S.refFormations=o.refFormations;
  S.agents.sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom));
  SESSION.forceWrite=true; await persistNow(); return {n,skip}; }
function importSeed(inp){ const f=inp.files[0]; if(!f) return; f.text().then(async t=>{ try{ const o=JSON.parse(t); if(o.format==="spv-coffre") return toast("C'est un fichier coffre : utilisez « Fusionner un fichier coffre » dans les réglages"); const r=await ingest(o); journal("import de données",r.n+" agent(s)"); await persistNow(); render(); toast(`${r.n} agent(s) importé(s) et chiffré(s)${r.skip?`, ${r.skip} déjà présent(s)`:""}. Supprimez maintenant le fichier d'origine.`); }catch(e){ toast(e.message||"Fichier illisible"); } }); inp.value=""; }
async function migrateLegacy(){ const o=legacyPlain(); if(!o) return; if(!await ask("Reprendre les données de l'ancienne version dans le coffre chiffré, puis effacer la copie en clair de ce navigateur ?","Migrer")) return;
  try{ const r=await ingest(o); localStorage.removeItem(LEGACY_KEY); localStorage.removeItem(LEGACY_KEY+"_theme"); journal("migration de la v1",r.n+" agent(s)"); await persistNow(); render(); toast(`${r.n} agent(s) repris. La copie en clair est effacée.`); }catch(e){ toast(e.message); } }

async function pickFond(inp){ const f=inp.files[0]; inp.value=""; if(!f) return;
  try{ let url; if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){ await needLib("pdf"); const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise; const pg=await pdf.getPage(1); const vp=pg.getViewport({scale:1}); const sc=1240/vp.width; const v2=pg.getViewport({scale:sc}); const c=document.createElement("canvas"); c.width=Math.round(v2.width); c.height=Math.round(v2.height); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:x,viewport:v2}).promise; url=c.toDataURL("image/jpeg",.85); await pdf.destroy(); }
    else { url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,1240/img.width); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.85)); }; img.onerror=rej; img.src=r.result; }; r.readAsDataURL(f); }); }
    setEntete("fond",url); toast("Fond de page enregistré"); }catch(e){ console.error(e); toast("Fichier illisible"); } }

  return `<header><h1>Synthèse</h1><p>Les données d'évaluation consolidées, et les arbitrages extraits par thème : formations, revalorisations, carrière, organisation du travail.</p></header>${scopeToggle()}${nav}${body}`;

function avisChip(v){ if(!v) return '<span class="chip">—</span>'; const c=/^Favorable$/.test(v)?"ok":/sous réserve|évaluer|auto/.test(v)?"warn":/Défav/.test(v)?"bad":""; return `<span class="chip ${c}">${esc(v)}</span>`; }
async function exportCSV(tab){ if(!can("exporter")) return; const t=document.getElementById("synTable"); if(!t){ toast("Rien à exporter"); return; } if(!await ask("Le fichier CSV ne sera pas chiffré. Le conserver sur un emplacement protégé et le supprimer après usage.","Exporter")) return; journal("export CSV de synthèse",tab); save(); const rows=[...t.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>'"'+td.innerText.replace(/"/g,'""').replace(/\n/g," ")+'"').join(";")); saveFile(`synthese-${tab}-${S.campagne.annee}.csv`,"\ufeff"+rows.join("\n"),"text/csv;charset=utf-8"); }
/* ============================================================
   IMPORT : FICHE DE POSTE + FICHE DE PAIE  → PROFIL AGENT
   Les documents sont lus dans ce navigateur, jamais envoyés ni conservés.
   Seuls les champs utiles à l'entretien sont retenus (minimisation RGPD).
   ============================================================ */
async function needLib(k){ if(k==="pdf"&&window.pdfjsLib&&window.pdfjsWorker) return; if(k==="docx"&&window.mammoth) return; throw new Error("Module de lecture absent du fichier."); }
function askPassword(reason){ return new Promise(res=>{ const o=modal(`<h3>Document protégé</h3><p class="small">${reason===2?"Mot de passe incorrect. ":""}Ce PDF est protégé par un mot de passe (souvent la date de naissance ou le matricule). Il sert uniquement à l'ouvrir ici et n'est pas conservé.</p><label class="f"><span>Mot de passe du PDF</span><input type="password" id="pdfPw" autocomplete="off"></label><div class="actions"><button class="btn primary" id="pwOk">Ouvrir</button><button class="btn" id="pwNo">Annuler</button></div>`); const i=o.querySelector("#pdfPw"); i.focus(); o.querySelector("#pwOk").onclick=()=>{ const v=i.value; o.remove(); res(v); }; i.onkeydown=e=>{ if(e.key==="Enter") o.querySelector("#pwOk").click(); }; o.querySelector("#pwNo").onclick=()=>{ o.remove(); res(null); }; }); }
async function pdfPages(buf,maxPages,progress){ await needLib("pdf");
  const task=pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false,enableXfa:false,stopAtErrors:false});
  task.onPassword=async(update,reason)=>{ const p=await askPassword(reason); if(p===null){ task.destroy(); } else update(p); };
  const pdf=await task.promise; const pages=[]; const N=Math.min(pdf.numPages,maxPages||8);
  for(let n=1;n<=N;n++){ const page=await pdf.getPage(n); const tc=await page.getTextContent(); const rows=[], lines=[];
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4]; let r=rows.find(r=>Math.abs(r.y-y)<=2.5); if(!r){ r={y,items:[]}; rows.push(r); } r.items.push({x,s:it.str,w:it.width||0}); }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); let line="",end=null; for(const it of r.items){ if(end!==null){ const gap=it.x-end; line+=gap>10?"   ":(gap>1.2&&!/\s$/.test(line)&&!/^\s/.test(it.s)?" ":""); } line+=it.s; end=it.x+it.w; } lines.push(line.normalize("NFC").replace(/\s+$/,"")); }
    pages.push(lines); page.cleanup(); progress&&progress(n,N); }
  await pdf.destroy(); return pages; }
async function pdfLines(buf){ return (await pdfPages(buf,8)).flat(); }
async function docxLines(buf){ await needLib("docx"); const r=await mammoth.extractRawText({arrayBuffer:buf}); return r.value.split(/\n/).map(l=>l.normalize("NFC").replace(/\t+/g,"   ").trimEnd()); }
async function fileLines(f){ const n=f.name.toLowerCase(); const buf=await f.arrayBuffer();
  if(n.endsWith(".pdf")||f.type==="application/pdf") return pdfLines(buf);
  if(n.endsWith(".docx")) return docxLines(buf);
  if(n.endsWith(".txt")||f.type.startsWith("text/")) return dec.decode(buf).split(/\r?\n/);
  if(n.endsWith(".doc")) throw new Error("Format .doc ancien : enregistrez la fiche en .docx ou en PDF.");
  throw new Error("Format non pris en charge : PDF, DOCX ou TXT."); }

/* --- extraction --- */
const plain=l=>l.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function valueAfter(lines,re,maxLen=90){ for(let i=0;i<lines.length;i++){ const l=lines[i]; const m=plain(l).match(re); if(!m) continue; let rest=l.slice(m.index+m[0].length).replace(/^\s*[:.\-–=]?\s*/,""); rest=rest.split(/\s{3,}/)[0].trim(); if(rest&&rest.length<=maxLen) return rest; if(!rest){ const nx=(lines[i+1]||"").split(/\s{3,}/)[0].trim(); if(nx&&nx.length<=maxLen&&!/[:]$/.test(nx)) return nx; } } return ""; }
const GRADE_RE=GRADES_FPT.map(([k,cat,fil])=>[new RegExp("(^|[^a-z])("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![a-z])"),k,cat,fil]);

function pageIdentity(lines){ const k=knownAgentIn(lines); if(k) return "a:"+k.id; const mat=valueAfter(lines,/\b(?:matricule|n°\s*agent|no\s*agent)\b/,30).match(/[A-Z0-9][A-Z0-9-]{1,14}/i); if(mat) return "m:"+mat[0].toUpperCase();

const FDP_EXT = /\.(pdf|docx|txt)$/i, FDP_OLD = /\.(doc|odt|rtf)$/i, FDP_EVERY = 5*60*1000;
let FDP = {h:null,perm:"",scan:null,busy:"",err:"",timer:null,scrollTo:false};
function fdpReset(){ clearInterval(FDP.timer); FDP={h:null,perm:"",scan:null,busy:"",err:"",timer:null,scrollTo:false}; }
function fdpTimer(){ clearInterval(FDP.timer); FDP.timer=setInterval(()=>{ if(SESSION&&FDP.h&&FDP.perm==="granted"&&!FDP.busy) fdpScan("bg"); },FDP_EVERY); }
const fdpCount = () => (FDP.scan&&SESSION&&can("importer")) ? FDP.scan.files.filter(f=>f.status==="new"||f.status==="maj").length : 0;
const fdpLinked = path => (S?S.agents:[]).filter(a=>a.fichePoste&&a.fichePoste.fichier===path);

async function fdpInit(){
  if(!SESSION||!can("importer")||!("showDirectoryPicker" in window)) return;
  const h=await IDB.get("fichesPoste"); if(!h||!SESSION) return;
  FDP.h=h; let p="prompt"; try{ p=await h.queryPermission({mode:"read"}); }catch(e){}
  FDP.perm=p;
  if(p==="granted"){ fdpTimer(); await fdpScan("bg"); }
  else { const {v}=route(); if(v==="accueil"||v==="import") render(); } }

async function fdpPick(){
  try{ const opts={id:"fiches-de-poste",mode:"read"}; if(FOLDER) opts.startIn=FOLDER;
    const h=await window.showDirectoryPicker(opts);
    if(FOLDER&&await h.isSameEntry(FOLDER)) return toast("C'est le dossier des données de l'application : choisissez le dossier FICHE DE POSTE");
    if(!/fiche/i.test(h.name)&&!await ask(`Le dossier choisi s'appelle « ${h.name} ». L'utiliser comme dossier des fiches de poste ?`,"Utiliser ce dossier")) return;
    FDP.h=h; FDP.perm="granted"; FDP.scan=null; FDP.err="";
    await IDB.set("fichesPoste",h); journal("dossier des fiches de poste relié",h.name); save();
    fdpTimer(); await fdpScan("ui"); }
  catch(e){ if(e.name!=="AbortError") toast("Dossier inaccessible : "+e.message); } }

async function fdpResume(){ if(!FDP.h) return fdpPick();
  try{ const p=await FDP.h.requestPermission({mode:"read"}); FDP.perm=p;
    if(p==="granted"){ fdpTimer(); await fdpScan("ui"); } else { toast("Lecture refusée par le navigateur"); render(); } }
  catch(e){ toast(e.message); } }

async function fdpForget(){ if(!await ask("Délier le dossier des fiches de poste de ce poste ? Les fiches déjà importées restent dans les dossiers des agents.","Délier")) return;
  await IDB.set("fichesPoste",null); journal("dossier des fiches de poste délié",FDP.h?FDP.h.name:""); save(); fdpReset(); render(); }

async function fdpWalk(dir,prefix,out,depth){
  for await (const [name,h] of dir.entries()){
    if(name.startsWith("~$")||name.startsWith(".")||/^thumbs\.db$/i.test(name)) continue;
    if(h.kind==="directory"){ if(depth<3) await fdpWalk(h,prefix+name+"/",out,depth+1); continue; }
    if(!FDP_EXT.test(name)&&!FDP_OLD.test(name)) continue;
    const f=await h.getFile();
    out.push({path:prefix+name,name,h,size:f.size,mod:f.lastModified,sig:f.size+"-"+f.lastModified,fmt:FDP_OLD.test(name)}); } }

function fdpStatus(f,ign){
  if(f.fmt) return "format";
  const linked=fdpLinked(f.path);
  if(linked.length) return linked.some(a=>a.fichePoste.sig===f.sig)?"ok":"maj";
  if((S?S.agents:[]).some(a=>a.fichePoste&&a.fichePoste.fichier&&a.fichePoste.sig===f.sig&&a.fichePoste.fichier.split("/").pop()===f.name)) return "ok"; // fichier déplacé
  if(ign[f.path]===f.sig) return "ignore";
  return "new"; }

/* mode "bg" : en arrière-plan, ne réaffiche que l'accueil (pour ne pas effacer une saisie en cours) ; "ui" : réaffiche */
async function fdpScan(mode){
  if(!FDP.h||FDP.busy||!SESSION) return;
  FDP.busy="Recherche des fiches dans « "+FDP.h.name+" »…"; if(mode==="ui") fdpPaint();
  try{ const files=[]; await fdpWalk(FDP.h,"",files,0); if(!SESSION) return;
    const ign=(await IDB.get("fdp_ignores"))||{};
    FDP.scan={at:Date.now(),files:files.map(f=>({...f,status:fdpStatus(f,ign)})).sort((a,b)=>a.path.localeCompare(b.path,"fr"))}; FDP.err=""; }
  catch(e){ console.warn(e);
    if(e&&(e.name==="NotAllowedError"||e.name==="SecurityError")){ FDP.perm="prompt"; FDP.err=""; }
    else FDP.err="Lecture du dossier impossible ("+(e.name||e.message)+"). Le lecteur réseau Z: est-il connecté ?"; }
  finally{ FDP.busy=""; }
  if(!SESSION) return;
  const {v}=route(); if(mode==="ui"||v==="accueil") render(); }

function fdpPaint(){ const el=document.getElementById("fdpSec"); if(el) el.outerHTML=fdpSection(); }
function fdpProgress(t){ FDP.busy=t; const e=document.getElementById("fdp_s"); if(e) e.innerHTML=`<span class="spin"></span> ${esc(t)}`; }

async function fdpPages(file){ const n=file.name.toLowerCase(); const buf=await file.arrayBuffer();
  if(n.endsWith(".pdf")) return pdfPages(buf,60);
  if(n.endsWith(".docx")){ const lines=await docxLines(buf); const pages=[]; let cur=[];
    for(const l of lines){ if(/^\s*fiche\s+de\s+poste\b/i.test(l)&&cur.some(x=>x.trim())){ pages.push(cur); cur=[]; } cur.push(l); } pages.push(cur); return pages; }
  return [dec.decode(buf).split(/\r?\n/)]; }

function fdpAgentFromName(fname){ const w=x=>" "+plain(x||"").replace(/[^a-z0-9]+/g," ").trim()+" "; const F=w(fname.replace(/\.[a-z0-9]+$/i,""));
  const A=(S?S.agents:[]).filter(a=>a.nom);
  const full=A.filter(a=>a.prenom&&F.includes(w(a.nom))&&F.includes(w(a.prenom)));
  if(full.length===1) return full[0]; if(full.length>1) return null;
  const byNom=A.filter(a=>a.nom.length>2&&F.includes(w(a.nom)));
  return byNom.length===1?byNom[0]:null; }

async function fdpAnalyse(all){
  if(!FDP.scan||FDP.busy) return;
  const list=FDP.scan.files.filter(f=>!f.fmt&&(all||f.status==="new"||f.status==="maj"));
  if(!list.length) return toast("Aucune fiche à analyser");
  FDP.busy="Lecture…"; fdpPaint(); const rows=[], bad=[]; let idx=0;
  try{
    for(let i=0;i<list.length;i++){ const f=list[i]; fdpProgress(`Lecture ${i+1} / ${list.length} : ${f.name}`);
      let pages;
      try{ pages=await fdpPages(await f.h.getFile()); }
      catch(e){ bad.push({name:f.path,err:/password/i.test(e&&e.name||"")?"PDF protégé":(e.message||"illisible")}); continue; }
      if(pages.flat().join(" ").trim().length<40){ bad.push({name:f.path,err:"aucun texte lisible, document scanné ?"}); continue; }
      let segs=splitPoste(pages);
      if(segs.length>1){ const ints=new Set(segs.map(sg=>plain(parsePoste(sg.lines).intitule||"")).filter(Boolean)); if(ints.size<2) segs=[{lines:pages.flat(),pages:pages.map((_,k)=>k+1)}]; }
      segs.forEach((sg,si)=>{ const fp=parsePoste(sg.lines); const norm=" "+plain(sg.lines.join(" ")).replace(/[^a-z0-9]+/g," ")+" ";
        const base={pages:sg.pages,fp,norm,file:f.path,seg:si,sig:f.sig,maj:f.status==="maj",nseg:segs.length};
        const linked=fdpLinked(f.path).filter(a=>(a.fichePoste.seg||0)===si);
        if(linked.length){ linked.forEach(a=>rows.push({...base,idx:idx++,target:a.id,who:a.nom+" "+a.prenom,how:"lien"})); return; }
        let a=knownAgentIn(sg.lines), how="nom dans la fiche";
        if(!a&&segs.length===1){ a=fdpAgentFromName(f.name); how="nom du fichier"; }
        rows.push({...base,idx:idx++,target:a?a.id:"skip",who:a?a.nom+" "+a.prenom:"",how:a?how:""}); });
      lines_wipe(segs); pages.length=0; }
  } finally { FDP.busy=""; }
  BULK.poste={name:"Dossier « "+FDP.h.name+" »",rows,src:"dossier",bad}; linkPosteToNewPaie();
  journal("lecture du dossier des fiches de poste",`${list.length} fichier(s), ${rows.length} fiche(s) repérée(s)`); save();
  FDP.scrollTo=true; if(route().v!=="import"||location.hash!=="#import") location.hash="#import"; else render(); }

async function fdpIgnore(i){ const r=BULK.poste&&BULK.poste.rows.find(x=>x.idx===i); if(!r||!r.file) return;
  const ign=(await IDB.get("fdp_ignores"))||{}; ign[r.file]=r.sig; await IDB.set("fdp_ignores",ign);
  BULK.poste.rows=BULK.poste.rows.filter(x=>x.file!==r.file);
  if(FDP.scan) FDP.scan.files.forEach(f=>{ if(f.path===r.file&&f.status==="new") f.status="ignore"; });
  render(); toast("« "+r.file.split("/").pop()+" » ne sera plus proposé"); }
async function fdpUnignore(i){ const f=FDP.scan&&FDP.scan.files[i]; if(!f) return; const path=f.path; const ign=(await IDB.get("fdp_ignores"))||{}; delete ign[path]; await IDB.set("fdp_ignores",ign); await fdpScan("ui"); }

function fdpSrcCell(r){ if(!r.file) return pagesTxt(r.pages);
  return `<span class="fdp-src" title="${esc(r.file)}">${ico("file")}${esc(r.file.split("/").pop())}</span>${r.nseg>1?"<br>"+pagesTxt(r.pages):""}${r.maj?'<br><span class="chip warn">modifiée</span>':""}`; }

function fdpFileRow(f,i){ const L={new:["nouvelle","warn"],maj:["modifiée","warn"],ok:["à jour","ok"],ignore:["ignorée",""],format:["ancien format : enregistrer en .docx ou PDF","bad"]}[f.status]||["",""];
  const who=fdpLinked(f.path).map(a=>esc(a.nom+" "+a.prenom)).join(", ");
  return `<tr><td><span class="fdp-src">${ico("file")}${esc(f.path)}</span></td><td class="small muted">${fmtDT(f.mod)}</td><td><span class="chip ${L[1]}">${L[0]}</span>${f.status==="ignore"?` <button class="btn small ghost" onclick="fdpUnignore(${i})">reproposer</button>`:""}</td><td class="small">${who||'<span class="muted">—</span>'}</td></tr>`; }

function fdpSection(){ if(!SESSION||!can("importer")) return "";
  if(FDP.scrollTo&&BULK.poste&&BULK.poste.src==="dossier"){ FDP.scrollTo=false; after.push(()=>{ const z=document.getElementById("bz_poste"); if(z) z.scrollIntoView({behavior:"smooth",block:"start"}); }); }
  const head=`<div class="fdp-h"><span class="ic">${ico("folder")}</span><div><h3 style="margin:0">Dossier des fiches de poste</h3><p class="small muted" style="margin:.15rem 0 0">Import automatique depuis <code class="k">${esc(FDP_PATH)}</code></p></div></div>`;
  let body="";
  if(!("showDirectoryPicker" in window)) body=`<div class="note warn">La lecture d'un dossier demande Google Chrome ou Microsoft Edge.</div>`;
  else if(!FDP.h) body=`<p>Reliez une fois le dossier où sont rangées les fiches de poste (PDF, Word .docx ou texte). L'application les lit sans les modifier, reconnaît l'agent de chaque fiche et vous propose, à chaque connexion, celles qui sont nouvelles ou qui ont changé. Vous vérifiez, puis vous validez.</p>
    <div class="actions"><button class="btn primary" onclick="fdpPick()">${ico("folder")} Relier le dossier FICHE DE POSTE</button></div>
    <p class="hint">L'explorateur s'ouvre sur le dossier ENTRETIENS PROS : remontez d'un niveau, sélectionnez <b>FICHE DE POSTE</b>, puis acceptez l'accès en lecture.</p>`;
  else if(FDP.perm!=="granted") body=`<p>Le dossier <b>${esc(FDP.h.name)}</b> est relié à ce poste. Pour des raisons de sécurité, Chrome demande votre accord pour le relire.</p>
    <div class="actions"><button class="btn primary" onclick="fdpResume()">${ico("folder")} Autoriser la lecture de « ${esc(FDP.h.name)} »</button><button class="btn ghost" onclick="fdpPick()">Choisir un autre dossier</button></div>
    <p class="hint">Si Chrome propose « Autoriser à chaque visite », choisissez-le : la détection se fera ensuite toute seule à la connexion.</p>`;
  else { const F=FDP.scan?FDP.scan.files:[]; const n=s=>F.filter(f=>f.status===s).length; const todo=n("new")+n("maj");
    body=`${FDP.busy?`<p id="fdp_s"><span class="spin"></span> ${esc(FDP.busy)}</p>`:FDP.scan?`<div class="fdp-stats"><span><b>${F.length}</b> fichier(s)</span><span class="chip ${n("new")?"warn":""}">${n("new")} nouvelle(s)</span><span class="chip ${n("maj")?"warn":""}">${n("maj")} modifiée(s)</span><span class="chip ok">${n("ok")} à jour</span>${n("ignore")?`<span class="chip">${n("ignore")} ignorée(s)</span>`:""}${n("format")?`<span class="chip bad">${n("format")} ancien format</span>`:""}</div>
      <p class="small muted" style="margin:.2rem 0 .4rem">« ${esc(FDP.h.name)} » vérifié le ${fmtDT(FDP.scan.at)} · nouvelle vérification automatique toutes les 5 minutes.</p>`:""}
      ${FDP.err?`<div class="note warn">${esc(FDP.err)}</div>`:""}
      <div class="actions"><button class="btn primary" ${todo&&!FDP.busy?"":"disabled"} onclick="fdpAnalyse(false)">${ico("list")} Analyser ${todo||""} fiche(s) nouvelle(s) ou modifiée(s)</button><button class="btn" ${FDP.busy?"disabled":""} onclick="fdpScan('ui')">${ico("refresh")} Actualiser</button><button class="btn ghost" ${F.some(f=>!f.fmt)&&!FDP.busy?"":"disabled"} onclick="fdpAnalyse(true)">Tout réanalyser</button><button class="btn ghost" onclick="fdpPick()">Changer de dossier</button><button class="btn ghost" onclick="fdpForget()">Délier</button></div>
      ${F.length?`<details class="box" style="margin-top:.8rem;margin-bottom:0"><summary>Voir les ${F.length} fichier(s)</summary><div class="scroll"><table class="t"><thead><tr><th>Fichier</th><th>Modifié le</th><th>État</th><th>Dossier agent</th></tr></thead><tbody>${F.map(fdpFileRow).join("")}</tbody></table></div></details>`:""}`; }
  return `<div class="card" id="fdpSec">${head}${body}</div>`; }

function fdpBanner(){ if(!SESSION||!can("importer")||!FDP.h) return "";
  if(FDP.perm!=="granted") return `<div class="note">${ico("folder")} Le dossier des fiches de poste <b>${esc(FDP.h.name)}</b> attend votre accord pour être relu. <button class="btn small" onclick="fdpResume()">Autoriser la lecture</button></div>`;
  const n=fdpCount(); if(!n) return "";
  return `<div class="note warn">${ico("folder")} <b>${n} fiche(s) de poste nouvelle(s) ou modifiée(s)</b> dans « ${esc(FDP.h.name)} ». <button class="btn small primary" onclick="fdpAnalyse(false)">Vérifier et importer</button></div>`; }

/* ============================================================
   DÉMARRAGE
   ============================================================ */
try{ const th=localStorage.getItem("spv_theme"); if(th&&th!=="auto") document.documentElement.setAttribute("data-theme",th); }catch(e){}
if(!(window.crypto&&crypto.subtle)){ document.getElementById("app").innerHTML=`<div class="agent-mode"><div class="note bad"><b>Chiffrement indisponible.</b> Ce navigateur ou ce mode d'ouverture ne donne pas accès au chiffrement. Ouvrez la page en https (ou depuis un fichier sur ce poste) avec Edge, Chrome ou Firefox à jour.</div></div>`; }
else { if(AGENT_ONLY){ if(AGENT_PACK) setOrg(AGENT_PACK); render(); } else gateLoad(); }

</script>
